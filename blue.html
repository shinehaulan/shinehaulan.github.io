<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 人相面相分析儀</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: #121212;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { margin-bottom: 8px; font-size: 1.5rem; color: #f5ba42; }
    .container {
      position: relative;
      width: 100%;
      max-width: 640px;
      aspect-ratio: 4 / 3;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* 鏡像翻轉，提升操作體驗 */
    }
    .guide-box {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      z-index: 10;
      color: #fff;
    }
    .status-warning { color: #ff5252; font-weight: bold; }
    .status-ok { color: #4caf50; font-weight: bold; }
    .report-card {
      width: 100%;
      max-width: 640px;
      margin-top: 16px;
      background: #1e1e1e;
      border-radius: 10px;
      padding: 16px;
      box-sizing: border-box;
      border: 1px solid #333;
    }
    .metric { margin: 8px 0; font-size: 0.95rem; }
    .bar {
      height: 8px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }
    .bar-fill {
      height: 100%;
      background: #f5ba42;
      width: 0%;
      transition: width 0.2s ease;
    }
    .disclaimer {
      font-size: 0.75rem;
      color: #777;
      margin-top: 12px;
      line-height: 1.4;
    }
    button {
      margin-top: 12px;
      padding: 10px 24px;
      font-size: 1rem;
      background: #f5ba42;
      border: none;
      border-radius: 6px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>AI 傳統人相格局分析</h1>
  <div class="container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>
    <div id="guide-text" class="guide-box">載入模型中...</div>
  </div>

  <button id="webcamButton">開啟鏡頭</button>

  <div class="report-card">
    <div id="pose-indicator" class="metric">角度狀態：待測</div>
    <hr style="border: 0; border-top: 1px solid #333;" />
    <div class="metric">上停比例（初年運/智力）：<span id="upper-ratio">-</span>
      <div class="bar"><div id="upper-bar" class="bar-fill"></div></div>
    </div>
    <div class="metric">中停比例（中年運/事業）：<span id="middle-ratio">-</span>
      <div class="bar"><div id="middle-bar" class="bar-fill"></div></div>
    </div>
    <div class="metric">下停比例（晚年運/聚財）：<span id="lower-ratio">-</span>
      <div class="bar"><div id="lower-bar" class="bar-fill"></div></div>
    </div>
    <div class="metric" style="margin-top: 12px; color: #f5ba42;">
      格局總評：<span id="reading-summary">請先正對鏡頭保持靜止</span>
    </div>
    
    <div class="disclaimer">
      【法律免責聲明】：本軟體運算皆於使用者裝置本地端執行，不收集亦不上傳任何個人人臉生物資訊。分析結果僅供休閒、傳統民俗文化娛樂參考，不構成任何命理、醫療或職業決策依據。
    </div>
  </div>

  <!-- 引入 MediaPipe 模組 -->
  <script type="module">
    import {
      FaceLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("webcam");
    const canvas = document.getElementById("output_canvas");
    const ctx = canvas.getContext("2d");
    const guideText = document.getElementById("guide-text");
    const webcamButton = document.getElementById("webcamButton");
    
    const poseIndicator = document.getElementById("pose-indicator");
    const upperRatioEl = document.getElementById("upper-ratio");
    const middleRatioEl = document.getElementById("middle-ratio");
    const lowerRatioEl = document.getElementById("lower-ratio");
    const upperBar = document.getElementById("upper-bar");
    const middleBar = document.getElementById("middle-bar");
    const lowerBar = document.getElementById("lower-bar");
    const readingSummary = document.getElementById("reading-summary");

    let faceLandmarker;
    let runningMode = "VIDEO";
    let lastVideoTime = -1;

    // 1. 初始化 FaceLandmarker (包含 478 點與虹膜細節)
    async function createFaceLandmarker() {
      const filesetResolver = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
        baseOptions: {
          modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
          delegate: "GPU"
        },
        outputFaceBlendshapes: false,
        runningMode: runningMode,
        numFaces: 1
      });
      guideText.innerText = "模型載入完成，請點擊開啟鏡頭";
    }
    createFaceLandmarker();

    // 2. 開啟鏡頭
    webcamButton.addEventListener("click", async () => {
      if (!faceLandmarker) return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480 }
        });
        video.srcObject = stream;
        video.addEventListener("loadeddata", predictWebcam);
        webcamButton.style.display = "none";
      } catch (err) {
        alert("無法存取攝影機，請確認瀏覽器權限。");
      }
    });

    // 3. 畫面即時預測與相學推算
    async function predictWebcam() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      if (lastVideoTime !== video.currentTime) {
        lastVideoTime = video.currentTime;
        const results = faceLandmarker.detectForVideo(video, performance.now());

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (results.faceLandmarks && results.faceLandmarks.length > 0) {
          const landmarks = results.faceLandmarks[0];

          // --- 防呆：側臉與頭部角度判斷 ---
          // 取左耳根(234)、右耳根(454)、鼻尖(1)
          const leftEar = landmarks[234];
          const rightEar = landmarks[454];
          const noseTip = landmarks[1];

          const distLeft = Math.abs(noseTip.x - leftEar.x);
          const distRight = Math.abs(noseTip.x - rightEar.x);
          const yawRatio = distLeft / (distRight + 0.0001); // 左右對稱比

          // 判斷側臉 (偏離中央超過 30%)
          const isTilted = yawRatio < 0.65 || yawRatio > 1.5;

          if (isTilted) {
            guideText.innerHTML = '<span class="status-warning">⚠️ 請正對鏡頭，避免偏頭或側臉</span>';
            poseIndicator.innerHTML = '<span class="status-warning">角度偏差過大 (請轉正)</span>';
            readingSummary.innerText = "偵測到側臉，已暫停分析以保證準確率";
          } else {
            guideText.innerHTML = '<span class="status-ok">✔ 姿勢正確，分析中</span>';
            poseIndicator.innerHTML = '<span class="status-ok">臉部端正</span>';
            
            // --- 人相學演算法：三停比例計算 ---
            // 標定點：髮際頂(10)、印堂(168)、準頭(1)、地閣/下巴(152)
            const pTop = landmarks[10];
            const pEyebrow = landmarks[168];
            const pNose = landmarks[1];
            const pChin = landmarks[152];

            // 歐氏距離計算長度
            const upperDist = Math.hypot(pEyebrow.x - pTop.x, pEyebrow.y - pTop.y);
            const middleDist = Math.hypot(pNose.x - pEyebrow.x, pNose.y - pEyebrow.y);
            const lowerDist = Math.hypot(pChin.x - pNose.x, pChin.y - pNose.y);

            const totalDist = upperDist + middleDist + lowerDist;
            const uPct = Math.round((upperDist / totalDist) * 100);
            const mPct = Math.round((middleDist / totalDist) * 100);
            const lPct = Math.round((lowerDist / totalDist) * 100);

            upperRatioEl.innerText = `${uPct}% (標準約 33%)`;
            middleRatioEl.innerText = `${mPct}% (標準約 33%)`;
            lowerRatioEl.innerText = `${lPct}% (標準約 33%)`;

            upperBar.style.width = `${uPct * 2}%`;
            middleBar.style.width = `${mPct * 2}%`;
            lowerBar.style.width = `${lPct * 2}%`;

            // 相學標準邏輯評估
            if (mPct > 36) {
              readingSummary.innerText = "【中停隆盛】：事業意志力堅韌，中晚年自主開創力強。";
            } else if (uPct > 36) {
              readingSummary.innerText = "【上停飽滿】：智識發達、思維縝密，早年得長輩提攜。";
            } else if (lPct > 36) {
              readingSummary.innerText = "【下停豐潤】：聚財蓄勢、底氣充沛，後福與人緣俱佳。";
            } else {
              readingSummary.innerText = "【三停均等】：中庸規矩之吉相，行事穩健、運勢平順。";
            }

            // 繪製關鍵標記點 (供使用者視覺回饋)
            drawPoint(ctx, pTop, "#00ffcc");
            drawPoint(ctx, pEyebrow, "#00ffcc");
            drawPoint(ctx, pNose, "#f5ba42");
            drawPoint(ctx, pChin, "#00ffcc");
            // 繪製虹膜中心點 (468 左眼, 473 右眼)
            drawPoint(ctx, landmarks[468], "#ff0077");
            drawPoint(ctx, landmarks[473], "#ff0077");
          }
        }
      }
      requestAnimationFrame(predictWebcam);
    }

    function drawPoint(ctx, pt, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(pt.x * canvas.width, pt.y * canvas.height, 4, 0, 2 * Math.PI);
      ctx.fill();
    }
  </script>
</body>
</html>
