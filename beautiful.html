<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>極簡尺碼測量 - 買鞋防退貨神器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* 滑桿手感優化 */
    input[type=range] {
      -webkit-appearance: none;
      background: #1e293b;
      border-radius: 9999px;
      height: 8px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 22px;
      width: 22px;
      border-radius: 50%;
      background: #38bdf8;
      border: 2px solid #ffffff;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
      cursor: pointer;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-3 font-sans select-none">

  <!-- 頂部標頭 -->
  <header class="w-full max-w-md flex items-center justify-between pb-2 border-b border-slate-800">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-white shadow text-sm">
        卡
      </div>
      <div>
        <h1 class="text-sm font-bold text-white">游標尺式精準量測</h1>
        <p class="text-[10px] text-slate-400">滑動推桿對齊・不擋視線・10秒完成</p>
      </div>
    </div>
    <span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-900 border border-slate-700 text-emerald-400 font-mono">
      健保卡基準 (8.56cm)
    </span>
  </header>

  <main class="w-full max-w-md mt-2 flex flex-col items-center space-y-3">

    <!-- 主取景/測量畫布 -->
    <div class="relative w-full aspect-[3/4] rounded-2xl overflow-hidden bg-slate-900 border border-slate-800 shadow-2xl flex items-center justify-center">
      <video id="webcam" class="absolute inset-0 w-full h-full object-cover" playsinline autoplay muted></video>
      <canvas id="view-canvas" class="absolute inset-0 w-full h-full object-cover z-10"></canvas>

      <!-- 拍攝引導框 (拍照前) -->
      <div id="guide-box" class="absolute inset-0 z-10 pointer-events-none p-4 flex flex-col justify-between">
        <div class="w-32 h-20 border-2 border-dashed border-sky-400/80 rounded-xl p-1 bg-sky-500/10 text-[10px] text-sky-300 font-bold flex items-center justify-center text-center">
          健保卡/悠遊卡<br>平放此處
        </div>
        <div class="self-end w-44 h-64 border-2 border-dashed border-emerald-400/80 rounded-2xl p-2 bg-emerald-500/10 text-[11px] text-emerald-300 flex items-center justify-center text-center font-bold">
          腳掌平放此處<br>(腳尖朝上)
        </div>
      </div>

      <!-- 水平感應提示 -->
      <div id="level-tip" class="absolute top-3 right-3 z-20 px-2 py-1 rounded-lg bg-black/70 backdrop-blur border border-slate-700 text-[10px] text-amber-300 font-medium">
        請垂直朝下拿平
      </div>

      <!-- 拍照控制鈕 -->
      <div id="cam-bar" class="absolute bottom-4 inset-x-0 flex justify-center items-center space-x-3 px-4 z-20">
        <button id="snap-btn" class="px-7 py-3 rounded-full bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-bold text-xs shadow-lg shadow-blue-600/30 flex items-center space-x-2 transition-all">
          <i data-lucide="camera" class="w-4 h-4"></i>
          <span>定格拍照開始測量</span>
        </button>
        <label class="px-4 py-3 rounded-full bg-slate-800 text-slate-300 font-bold text-xs border border-slate-700 cursor-pointer flex items-center space-x-1.5 active:scale-95">
          <i data-lucide="image" class="w-4 h-4"></i>
          <span>相片</span>
          <input id="file-input" type="file" accept="image/*" class="hidden">
        </label>
      </div>

      <!-- 定格後的動作按鈕 -->
      <div id="frozen-bar" class="hidden absolute top-3 left-3 z-20">
        <button id="retake-btn" class="px-3 py-1.5 rounded-lg bg-slate-900/90 border border-slate-700 text-[11px] text-slate-300 font-semibold flex items-center space-x-1 shadow">
          <i data-lucide="refresh-cw" class="w-3 h-3"></i>
          <span>重拍</span>
        </button>
      </div>
    </div>

    <!-- 步驟推桿微調面板 (定格後顯示) -->
    <div id="slider-panel" class="hidden w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3.5">
      <div class="text-xs font-bold text-white flex items-center justify-between border-b border-slate-800 pb-2">
        <span>滑動推桿對齊（如同游標卡尺）：</span>
        <span class="text-[10px] text-sky-400">直覺好拉・絕不擋手</span>
      </div>

      <!-- 1. 卡片寬度校準推桿 -->
      <div class="space-y-1">
        <div class="flex justify-between text-[11px]">
          <span class="text-sky-300 font-bold flex items-center space-x-1">
            <span class="w-2 h-2 rounded-full bg-sky-400 inline-block"></span>
            <span>1. 健保卡寬度框線</span>
          </span>
          <span id="card-px-val" class="text-slate-400 font-mono text-[10px]">校準中</span>
        </div>
        <input id="slider-card" type="range" min="60" max="320" value="130" class="w-full">
      </div>

      <!-- 2. 腳尖推桿 -->
      <div class="space-y-1">
        <div class="flex justify-between text-[11px]">
          <span class="text-blue-400 font-bold flex items-center space-x-1">
            <span class="w-2 h-2 rounded-full bg-blue-500 inline-block"></span>
            <span>2. 腳趾最前端（切齊大拇趾）</span>
          </span>
        </div>
        <input id="slider-toe" type="range" min="5" max="95" value="25" class="w-full">
      </div>

      <!-- 3. 腳跟推桿 -->
      <div class="space-y-1">
        <div class="flex justify-between text-[11px]">
          <span class="text-indigo-400 font-bold flex items-center space-x-1">
            <span class="w-2 h-2 rounded-full bg-indigo-500 inline-block"></span>
            <span>3. 腳後跟最後端（切齊腳後凸點）</span>
          </span>
        </div>
        <input id="slider-heel" type="range" min="5" max="95" value="80" class="w-full">
      </div>

      <!-- 4. 腳掌寬度推桿 -->
      <div class="space-y-1">
        <div class="flex justify-between text-[11px]">
          <span class="text-emerald-400 font-bold flex items-center space-x-1">
            <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span>
            <span>4. 腳掌最寬處（推桿貼緊兩側）</span>
          </span>
        </div>
        <input id="slider-width" type="range" min="30" max="240" value="110" class="w-full">
      </div>
    </div>

    <!-- 尺碼計算看板 -->
    <div class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3">
      <div class="grid grid-cols-2 gap-2 text-center">
        <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
          <div class="text-[10px] text-slate-400">實測裸足長</div>
          <div id="res-foot-len" class="text-base font-bold text-blue-400 font-mono mt-0.5">-- cm</div>
        </div>
        <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
          <div class="text-[10px] text-slate-400">實測足掌寬</div>
          <div id="res-foot-width" class="text-base font-bold text-emerald-400 font-mono mt-0.5">-- cm</div>
        </div>
      </div>

      <!-- 推薦尺碼盒 -->
      <div class="bg-gradient-to-r from-blue-950/60 to-indigo-950/60 border border-blue-500/30 p-3.5 rounded-xl space-y-2">
        <div class="flex items-center justify-between border-b border-blue-500/20 pb-1.5">
          <span class="text-xs font-bold text-blue-300 flex items-center space-x-1">
            <i data-lucide="check-circle" class="w-3.5 h-3.5 text-blue-400"></i>
            <span>防退貨建議下單鞋碼</span>
          </span>
          <span class="text-[9px] px-1.5 py-0.5 bg-blue-500/20 text-blue-300 rounded font-mono">
            已加 +0.8cm 穿襪放量
          </span>
        </div>

        <div id="size-result-box" class="text-xs space-y-1 text-slate-200">
          拍照後推動上方推桿切齊腳邊，立即精確換算。
        </div>

        <!-- 寬楦警告 -->
        <div id="wide-alert" class="hidden p-2 bg-amber-500/10 border border-amber-500/30 rounded-lg text-[11px] text-amber-300">
          ⚠️ <strong>寬楦提醒</strong>：您的腳掌比例偏寬，<strong>強烈建議選擇大半號或 2E 寬楦版</strong>，避免兩側擠腳退貨！
        </div>
      </div>
    </div>

  </main>

  <script>
    lucide.createIcons();

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('view-canvas');
    const ctx = canvas.getContext('2d');

    const snapBtn = document.getElementById('snap-btn');
    const retakeBtn = document.getElementById('retake-btn');
    const fileInput = document.getElementById('file-input');
    const guideBox = document.getElementById('guide-box');
    const camBar = document.getElementById('cam-bar');
    const frozenBar = document.getElementById('frozen-bar');
    const sliderPanel = document.getElementById('slider-panel');
    const levelTip = document.getElementById('level-tip');

    const sliderCard = document.getElementById('slider-card');
    const sliderToe = document.getElementById('slider-toe');
    const sliderHeel = document.getElementById('slider-heel');
    const sliderWidth = document.getElementById('slider-width');

    const resFootLen = document.getElementById('res-foot-len');
    const resFootWidth = document.getElementById('res-foot-width');
    const sizeResultBox = document.getElementById('size-result-box');
    const wideAlert = document.getElementById('wide-alert');

    let isFrozen = false;
    let frozenImage = null;
    const CARD_REAL_CM = 8.56;

    // 啟動鏡頭
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 960 } }
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          video.play();
          resizeCanvas();
          renderLoop();
        };
      } catch (e) {
        levelTip.innerText = "相機已關閉，可點「相片」上傳";
      }

      window.addEventListener('deviceorientation', (e) => {
        if (isFrozen) return;
        const offset = Math.hypot(e.gamma || 0, e.beta || 0);
        if (offset < 9) {
          levelTip.innerText = "✓ 已放平，角度精準";
          levelTip.className = "absolute top-3 right-3 z-20 px-2 py-1 rounded-lg bg-emerald-950/80 border border-emerald-500 text-[10px] text-emerald-300 font-medium";
        } else {
          levelTip.innerText = "請垂直朝下拿平";
          levelTip.className = "absolute top-3 right-3 z-20 px-2 py-1 rounded-lg bg-black/70 backdrop-blur border border-slate-700 text-[10px] text-amber-300 font-medium";
        }
      });
    }
    initCamera();

    function resizeCanvas() {
      canvas.width = canvas.clientWidth || 360;
      canvas.height = canvas.clientHeight || 480;
    }
    window.onresize = resizeCanvas;

    function renderLoop() {
      if (!isFrozen && video.readyState >= 2) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      }
      requestAnimationFrame(renderLoop);
    }

    // 拍照定格
    snapBtn.onclick = () => {
      isFrozen = true;
      const off = document.createElement('canvas');
      off.width = canvas.width;
      off.height = canvas.height;
      off.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      frozenImage = off;
      enterFrozen();
    };

    fileInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          isFrozen = true;
          resizeCanvas();
          const off = document.createElement('canvas');
          off.width = canvas.width;
          off.height = canvas.height;
          off.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          frozenImage = off;
          enterFrozen();
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    };

    function enterFrozen() {
      guideBox.classList.add('hidden');
      camBar.classList.add('hidden');
      frozenBar.classList.remove('hidden');
      sliderPanel.classList.remove('hidden');
      levelTip.classList.add('hidden');
      redraw();
      updateCalc();
    }

    retakeBtn.onclick = () => {
      isFrozen = false;
      frozenImage = null;
      guideBox.classList.remove('hidden');
      camBar.classList.remove('hidden');
      frozenBar.classList.add('hidden');
      sliderPanel.classList.add('hidden');
      levelTip.classList.remove('hidden');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    };

    // 重新繪製定格影像與直覺標尺線
    function redraw() {
      if (!frozenImage) return;
      const w = canvas.width;
      const h = canvas.height;

      ctx.drawImage(frozenImage, 0, 0, w, h);

      // 1. 繪製卡片基準尺規 (左上方)
      const cardPx = parseFloat(sliderCard.value);
      const cardH = cardPx * (5.398 / 8.56);
      const cardX = w * 0.08;
      const cardY = h * 0.06;

      ctx.save();
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([4, 3]);
      ctx.strokeRect(cardX, cardY, cardPx, cardH);
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText(`💳 健保卡寬度 (${CARD_REAL_CM}cm)`, cardX, cardY - 5);
      ctx.restore();

      // 2. 繪製腳尖切線 (橫向游標尺)
      const toeY = (parseFloat(sliderToe.value) / 100) * h;
      ctx.save();
      ctx.strokeStyle = '#60a5fa';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(w * 0.40, toeY);
      ctx.lineTo(w * 0.98, toeY);
      ctx.stroke();
      ctx.fillStyle = '#60a5fa';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText('▲ 腳趾最前端', w * 0.42, toeY - 6);
      ctx.restore();

      // 3. 繪製腳跟切線 (橫向游標尺)
      const heelY = (parseFloat(sliderHeel.value) / 100) * h;
      ctx.save();
      ctx.strokeStyle = '#818cf8';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(w * 0.40, heelY);
      ctx.lineTo(w * 0.98, heelY);
      ctx.stroke();
      ctx.fillStyle = '#818cf8';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText('▼ 腳後跟最後端', w * 0.42, heelY + 14);
      ctx.restore();

      // 4. 繪製腳寬
