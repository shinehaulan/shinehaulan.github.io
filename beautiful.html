<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AuraStyle - 全方位造型與試鏡模擬鏡</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    .mirror-view {
      transform: scaleX(-1);
      -webkit-transform: scaleX(-1);
    }
    .tab-btn.active {
      background-color: #ec4899;
      color: #ffffff;
    }
    .opt-chip.active {
      border-color: #ec4899;
      background-color: rgba(236, 72, 153, 0.2);
      color: #f472b6;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-2 sm:p-4 font-sans selection:bg-pink-500">

  <!-- 頂部標頭 -->
  <header class="w-full max-w-md flex items-center justify-between pb-2 border-b border-slate-800">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-pink-500 to-rose-600 flex items-center justify-center font-bold text-white shadow-lg shadow-pink-500/20 text-sm">
        S
      </div>
      <div>
        <h1 class="text-sm font-bold text-white tracking-wide">AuraStyle 全面造型鏡</h1>
        <p class="text-[9px] text-slate-400">妝容・睫毛・耳環・髮夾・髮色・眼鏡</p>
      </div>
    </div>
    <div class="flex items-center space-x-1.5">
      <span id="status-badge" class="px-2 py-0.5 rounded-full bg-slate-900 border border-slate-800 text-[10px] text-yellow-400 font-mono">
        待啟動
      </span>
    </div>
  </header>

  <main class="w-full max-w-md mt-2 flex flex-col items-center space-y-3">
    
    <!-- 鏡頭與 AR 畫布 -->
    <div class="relative w-full aspect-[3/4] rounded-2xl overflow-hidden bg-slate-900 border border-slate-800 shadow-2xl flex items-center justify-center">
      <video id="webcam" class="absolute inset-0 w-full h-full object-cover mirror-view" playsinline autoplay muted></video>
      <canvas id="ar-canvas" class="absolute inset-0 w-full h-full object-cover mirror-view z-10 pointer-events-none"></canvas>

      <!-- 即時除錯/狀態條 -->
      <div id="debug-log" class="absolute bottom-2 inset-x-2 bg-black/80 backdrop-blur-md text-emerald-400 font-mono text-[10px] px-2 py-1 rounded border border-emerald-500/30 z-20 truncate">
        系統就緒，請點擊中央按鈕啟動相機
      </div>

      <!-- 長按看原始素顏 -->
      <button id="compare-btn" class="absolute top-3 right-3 bg-slate-900/80 hover:bg-slate-800 active:bg-pink-600 backdrop-blur-md border border-slate-700/80 text-slate-200 active:text-white text-[11px] px-3.5 py-1 rounded-full z-20 transition-all select-none shadow-md">
        按住看原始素顏
      </button>

      <!-- 核心啟動按鈕 -->
      <div id="start-overlay" class="absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center p-6 text-center space-y-4 z-30">
        <div class="w-16 h-16 rounded-full bg-pink-500/20 flex items-center justify-center text-pink-400 border border-pink-500/40">
          <i data-lucide="sparkles" class="w-8 h-8"></i>
        </div>
        <div>
          <h3 class="text-base font-bold text-white">啟動 AI 全面造型鏡</h3>
          <p class="text-xs text-slate-400 mt-1">請點擊下方按鈕以取得手機鏡頭即時體驗</p>
        </div>
        <button id="start-cam-btn" class="w-full py-3 bg-gradient-to-r from-pink-500 to-rose-600 rounded-xl text-xs font-bold text-white shadow-lg shadow-pink-500/30 active:scale-95 transition-all">
          開啟相機
        </button>
      </div>
    </div>

    <!-- 造型配置導覽 Tab (增加第 6 類：眼鏡) -->
    <div class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-3 shadow-xl space-y-3">
      
      <!-- 類別分頁 -->
      <div class="grid grid-cols-6 gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800/80 text-[10px] text-center font-medium">
        <button class="tab-btn active py-1.5 rounded-lg transition-all" data-tab="makeup">彩妝</button>
        <button class="tab-btn py-1.5 rounded-lg text-slate-400 transition-all" data-tab="glasses">眼鏡</button>
        <button class="tab-btn py-1.5 rounded-lg text-slate-400 transition-all" data-tab="lashes">睫毛</button>
        <button class="tab-btn py-1.5 rounded-lg text-slate-400 transition-all" data-tab="earrings">耳環</button>
        <button class="tab-btn py-1.5 rounded-lg text-slate-400 transition-all" data-tab="hairclip">髮夾</button>
        <button class="tab-btn py-1.5 rounded-lg text-slate-400 transition-all" data-tab="haircolor">髮色</button>
      </div>

      <!-- 面板內容 -->
      <div id="tab-content" class="min-h-[70px]">
        
        <!-- 彩妝面板 -->
        <div id="pane-makeup" class="pane-item grid grid-cols-4 gap-1.5 text-[11px]">
          <button class="opt-chip active p-2 rounded-xl border border-slate-800 bg-slate-950/60 text-center" data-type="makeup" data-val="clean">白開水</button>
          <button class="opt-chip p-2 rounded-xl border border-slate-800 bg-slate-950/60 text-center" data-type="makeup" data-val="french">法式紅唇</button>
          <button class="opt-chip p-2 rounded-xl border border-slate-800 bg-slate-950/60 text-center" data-type="makeup" data-val="peach">蜜桃奶茶</button>
          <button class="opt-chip p-2 rounded-xl border border-slate-800 bg-slate-950/60 text-center" data-type="makeup" data-val="smoky">千金煙燻</button>
        </div>

        <!-- 眼鏡/墨鏡面板 (新增) -->
        <div id="pane-glasses" class="pane-item hidden grid grid-cols-5 gap-1.5 text-[10px]">
          <button class="opt-chip active p-2 rounded-xl border border-slate-800 bg-slate-950/60 text-center" data-type="glasses" data-val="none">不戴眼鏡</button>
          <button class="opt-chip p-2 rounded-xl border border-slate-800 bg-slate-950/60 text-center" data-type="glasses" data-val="gold-round">金絲細框</button>
          <button class="opt-chip p-2 rounded-xl border border-slate-800 bg-slate-950/60 text-center" data-type="glasses" data-val="black-square">黑潮粗框</button>
          <button class="opt-chip p-2 rounded-xl border border-slate-800 bg-slate-950/60 text-center" data-type="glasses" data-val="aviator">飛行墨鏡</button>
          <button class="opt-chip p-2 rounded-xl border border-slate-800 bg-slate-950/60 text-center" data-type="glasses" data-val="cat-tea">復古茶晶</button>
        </div>

        <!-- 睫毛面板 -->
        <div id="pane-lashes" class="pane-item hidden grid grid-cols-4 gap-1.5 text-[11px]">
          <button class="opt-chip p-2 rounded-xl border border-slate-800 bg-slate-950/60 text-center" data-type="lashes" data-val="none">無睫毛</button>
          <button class="opt-chip active p-2 rounded-xl border border-slate-800 bg-slate-950/60 text-center" data-type="lashes" data-val="natural">自然心機</button>
          <button class="opt-chip p-2 rounded-xl border border-slate-800 bg-slate-950/60 text-center" data-type="lashes" data-val="sunflower">太陽花束</button>
          <button class="opt-chip p-2 rounded-xl border border-slate-800 bg-slate-950/60 text-center" data-type="lashes" data-val="doll">濃密芭比</button>
        </div>

        <!-- 耳環面板 -->
        <div id="pane-earrings" class="pane-item hidden grid grid-cols-4 gap-1.5 text-[11px]">
          <button class="opt-chip p-2 rounded-xl border border-slate-800 bg-slate-950/60 text-center" data-type="earrings" data-val="none">不戴耳飾</button>
          <button class="opt-chip active p-2 rounded-xl border border-slate-800 bg-slate-950/60 text-center" data-type="earrings" data-val="pearl">珍珠耳釘</button>
          <button class="opt-chip p-2 rounded-xl border border-slate-800 bg-slate-950/60 text-center" data-type="earrings" data-val="hoop">金屬圓圈</button>
          <button class="opt-chip p-2 rounded-xl border border-slate-800 bg-slate-950/60 text-center" data-type="earrings" data-val="tassel">長流蘇</button>
        </div>

        <!-- 髮夾面板 -->
        <div id="pane-hairclip" class="pane-item hidden grid grid-cols-4 gap-1.5 text-[11px]">
          <button class="opt-chip active p-2 rounded-xl border border-slate-800 bg-slate-950/60 text-center" data-type="hairclip" data-val="none">不戴髮夾</button>
          <button class="opt-chip p-2 rounded-xl border border-slate-800 bg-slate-950/60 text-center" data-type="hairclip" data-val="pearl-bar">珍珠排夾</button>
          <button class="opt-chip p-2 rounded-xl border border-slate-800 bg-slate-950/60 text-center" data-type="hairclip" data-val="metal-gold">金屬邊夾</button>
          <button class="opt-chip p-2 rounded-xl border border-slate-800 bg-slate-950/60 text-center" data-type="hairclip" data-val="cross-pin">少女十字夾</button>
        </div>

        <!-- 髮色面板 -->
        <div id="pane-haircolor" class="pane-item hidden grid grid-cols-4 gap-1.5 text-[11px]">
          <button class="opt-chip active p-2 rounded-xl border border-slate-800 bg-slate-950/60 text-center" data-type="haircolor" data-val="none">原生髮</button>
          <button class="opt-chip p-2 rounded-xl border border-slate-800 bg-slate-950/60 text-center" data-type="haircolor" data-val="ash-grey">黑茶灰</button>
          <button class="opt-chip p-2 rounded-xl border border-slate-800 bg-slate-950/60 text-center" data-type="haircolor" data-val="honey-brown">焦糖橘</button>
          <button class="opt-chip p-2 rounded-xl border border-slate-800 bg-slate-950/60 text-center" data-type="haircolor" data-val="berry-pink">微醺莓粉</button>
        </div>

      </div>

      <!-- 妝效顯色度滑桿 -->
      <div class="pt-1 flex items-center space-x-3 text-[11px] text-slate-400">
        <span>彩妝濃淡</span>
        <input id="intensity-slider" type="range" min="0.4" max="1.5" step="0.05" value="1.0" class="w-full accent-pink-500 bg-slate-800 rounded-lg h-1.5 cursor-pointer">
      </div>
    </div>

  </main>

  <script>
    lucide.createIcons();

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('ar-canvas');
    const ctx = canvas.getContext('2d');

    const debugLog = document.getElementById('debug-log');
    const startOverlay = document.getElementById('start-overlay');
    const startCamBtn = document.getElementById('start-cam-btn');
    const statusBadge = document.getElementById('status-badge');
    const intensitySlider = document.getElementById('intensity-slider');
    const compareBtn = document.getElementById('compare-btn');

    function log(msg) {
      console.log(msg);
      debugLog.innerText = `[${new Date().toLocaleTimeString().split(' ')[0]}] ${msg}`;
    }

    let faceMesh = null;
    let isProcessing = false;
    let hideAll = false;
    let makeupIntensity = 1.0;

    let activeConfig = {
      makeup: 'clean',
      glasses: 'none',
      lashes: 'natural',
      earrings: 'pearl',
      hairclip: 'none',
      haircolor: 'none'
    };

    const STYLES = {
      clean: { lip: [255, 105, 140, 0.65], blush: [255, 140, 160, 0.35], shadow: [255, 180, 190, 0.3] },
      french: { lip: [215, 20, 45, 0.82], blush: [220, 40, 60, 0.28], shadow: [160, 90, 40, 0.4] },
      peach: { lip: [240, 100, 50, 0.72], blush: [250, 140, 60, 0.38], shadow: [240, 150, 70, 0.35] },
      smoky: { lip: [175, 50, 75, 0.75], blush: [180, 70, 100, 0.3], shadow: [70, 60, 55, 0.55] }
    };

    const UPPER_LIP = [61, 185, 40, 39, 37, 0, 267, 269, 270, 409, 291, 308, 415, 310, 311, 312, 13, 82, 81, 80, 191, 78];
    const LOWER_LIP = [291, 375, 321, 405, 314, 17, 84, 181, 91, 146, 61, 78, 95, 88, 178, 87, 14, 317, 402, 318, 324, 308];
    const LEFT_EYE = [226, 247, 30, 29, 27, 28, 56, 190, 243, 112, 26, 22, 23, 24, 110, 25];
    const RIGHT_EYE = [463, 414, 286, 258, 257, 259, 260, 467, 359, 255, 339, 254, 253, 252, 256, 341];
    const LEFT_LASH_PTS = [33, 246, 161, 160, 159, 158, 157, 173, 133];
    const RIGHT_LASH_PTS = [362, 398, 384, 385, 386, 387, 388, 466, 263];

    function initFaceMesh() {
      try {
        if (typeof FaceMesh === 'undefined') {
          log("錯誤：MediaPipe 腳本下載失敗，請檢查網路");
          return;
        }
        log("配置 FaceMesh 引擎中...");
        faceMesh = new FaceMesh({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });
        faceMesh.setOptions({
          maxNumFaces: 1,
          refineLandmarks: true,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });
        faceMesh.onResults(onResults);
        log("FaceMesh 就緒");
      } catch (e) {
        log(`模型初始化異常: ${e.message}`);
      }
    }

    startCamBtn.onclick = async () => {
      startCamBtn.disabled = true;
      log("請求相機權限...");

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'user',
            width: { ideal: 640 },
            height: { ideal: 480 }
          },
          audio: false
        });

        video.srcObject = stream;
        video.onloadedmetadata = () => {
          video.play();
          startOverlay.classList.add('hidden');
          statusBadge.innerText = "相機正常";
          statusBadge.className = "px-2 py-0.5 rounded-full bg-slate-900 border border-slate-800 text-[10px] text-emerald-400 font-mono";
          log("相機啟動成功，即時追蹤中");

          if (!faceMesh) initFaceMesh();
          requestAnimationFrame(renderLoop);
        };
      } catch (err) {
        log(`相機開啟失敗: ${err.name} - ${err.message}`);
        startCamBtn.disabled = false;
      }
    };

    async function renderLoop() {
      if (video.readyState >= 2 && faceMesh && !isProcessing) {
        isProcessing = true;
        try {
          await faceMesh.send({ image: video });
        } catch (e) {}
        isProcessing = false;
      }
      requestAnimationFrame(renderLoop);
    }

    function onResults(results) {
      if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0 || hideAll) {
        return;
      }

      const lm = results.multiFaceLandmarks[0];
      const w = canvas.width;
      const h = canvas.height;

      // 1. 髮色
      if (activeConfig.haircolor !== 'none') {
        drawHairColor(ctx, lm, w, h, activeConfig.haircolor);
      }

      // 2. 彩妝
      const s = STYLES[activeConfig.makeup];
      drawEyeShadow(ctx, lm, LEFT_EYE, w, h, s.shadow);
      drawEyeShadow(ctx, lm, RIGHT_EYE, w, h, s.shadow);
      drawBlush(ctx, lm[116], w, h, s.blush);
      drawBlush(ctx, lm[345], w, h, s.blush);
      drawLip(ctx, lm, UPPER_LIP, LOWER_LIP, w, h, s.lip);

      // 3. 睫毛
      if (activeConfig.lashes !== 'none') {
        drawEyelashes(ctx, lm, LEFT_LASH_PTS, w, h, activeConfig.lashes, false);
        drawEyelashes(ctx, lm, RIGHT_LASH_PTS, w, h, activeConfig.lashes, true);
      }

      // 4. 眼鏡 / 墨鏡 (位於睫毛之上、髮夾之下)
      if (activeConfig.glasses !== 'none') {
        drawGlasses(ctx, lm, w, h, activeConfig.glasses);
      }

      // 5. 耳環
      if (activeConfig.earrings !== 'none') {
        drawEarring(ctx, lm[177], w, h, activeConfig.earrings, false);
        drawEarring(ctx, lm[401], w, h, activeConfig.earrings, true);
      }

      // 6. 髮夾
      if (activeConfig.hairclip !== 'none') {
        drawHairClip(ctx, lm, w, h, activeConfig.hairclip);
      }
    }

    // ─── 眼鏡與墨鏡渲染引擎 ───
    function drawGlasses(c, lm, w, h, style) {
      c.save();
      // 雙眼瞳孔中心與鼻樑交界錨點
      const leftEye = lm[468] || lm[159];
      const rightEye = lm[473] || lm[386];
      const noseBridge = lm[6] || lm[168];

      const lx = leftEye.x * w;
      const ly = leftEye.y * h;
      const rx = rightEye.x * w;
      const ry = rightEye.y * h;
      const nx = noseBridge.x * w;
      const ny = noseBridge.y * h;

      const eyeDist = Math.hypot(rx - lx, ry - ly);
      const angle = Math.atan2(ry - ly, rx - lx);
      const lensR = eyeDist * 0.36; // 鏡片半徑

      c.translate(nx, ny);
      c.rotate(angle);

      const offsetL = -eyeDist * 0.52;
      const offsetR = eyeDist * 0.52;

      // 1. 金絲細圓框
      if (style === 'gold-round') {
        c.strokeStyle = '#eab308';
        c.lineWidth = 2.2;
        c.fillStyle = 'rgba(255, 255, 255, 0.08)';

        // 左鏡框與微光
        c.beginPath();
        c.arc(offsetL, 2, lensR, 0, Math.PI * 2);
        c.fill();
        c.stroke();

        // 右鏡框與微光
        c.beginPath();
        c.arc(offsetR, 2, lensR, 0, Math.PI * 2);
        c.fill();
        c.stroke();

        // 中間鼻梁橫樑
        c.beginPath();
        c.arc(0, -lensR * 0.3, lensR * 0.45, 0.2, Math.PI - 0.2);
        c.stroke();
      }

      // 2. 黑潮粗方框
      else if (style === 'black-square') {
        c.strokeStyle = '#09090b';
        c.lineWidth = 4.5;
        c.lineJoin = 'round';
        c.fillStyle = 'rgba(255, 255, 255, 0.05)';

        const rw = lensR * 2.1;
        const rh = lensR * 1.8;

        // 左鏡框
        c.strokeRect(offsetL - rw / 2, -rh / 2 + 3, rw, rh);
        c.fillRect(offsetL - rw / 2, -rh / 2 + 3, rw, rh);

        // 右鏡框
        c.strokeRect(offsetR - rw / 2, -rh / 2 + 3, rw, rh);
        c.fillRect(offsetR - rw / 2, -rh / 2 + 3, rw, rh);

        // 鼻梁橋
        c.beginPath();
        c.moveTo(offsetL + rw / 2, 0);
        c.lineTo(offsetR - rw / 2, 0);
        c.stroke();
      }

      // 3. 飛行員墨鏡 (經典漸層黑)
      else if (style === 'aviator') {
        c.strokeStyle = '#ca8a04';
        c.lineWidth = 2.4;

        // 左鏡片漸層
        const gradL = c.createLinearGradient(0, -lensR, 0, lensR * 1.3);
        gradL.addColorStop(0, 'rgba(15, 23, 42, 0.88)');
        gradL.addColorStop(1, 'rgba(30, 41, 59, 0.45)');

        c.fillStyle = gradL;
        drawAviatorLens(c, offsetL, 2, lensR);
        drawAviatorLens(c, offsetR, 2, lensR);

        // 飛行員經典雙橫樑
        c.beginPath();
        c.moveTo(offsetL + lensR * 0.6, -lensR * 0.8);
        c.lineTo(offsetR - lensR * 0.6, -lensR * 0.8);
        c.moveTo(offsetL + lensR * 0.75, 0);
        c.lineTo(offsetR - lensR * 0.75, 0);
        c.stroke();
      }

      // 4. 復古茶晶貓眼墨鏡
      else if (style === 'cat-tea') {
        c.strokeStyle = '#78350f';
        c.lineWidth = 3.8;

        const gradTea = c.createLinearGradient(0, -lensR, 0, lensR);
        gradTea.addColorStop(0, 'rgba(120, 53, 15, 0.82)');
        gradTea.addColorStop(1, 'rgba(217, 119, 6, 0.5)');

        c.fillStyle = gradTea;

        // 左貓眼鏡框
        drawCatEyeLens(c, offsetL, 0, lensR, -1);
        // 右貓眼鏡框
        drawCatEyeLens(c, offsetR, 0, lensR, 1);

        // 鼻樑連接
        c.beginPath();
        c.moveTo(offsetL + lensR * 0.7, 2);
        c.lineTo(offsetR - lensR * 0.7, 2);
        c.stroke();
      }

      c.restore();
    }

    function drawAviatorLens(c, cx, cy, r) {
      c.beginPath();
      c.moveTo(cx - r * 0.9, cy - r * 0.7);
      c.lineTo(cx + r * 0.9, cy - r * 0.7);
      c.quadraticCurveTo(cx + r * 1.1, cy + r * 0.9, cx, cy + r * 1.25);
      c.quadraticCurveTo(cx - r * 1.1, cy + r * 0.9, cx - r * 0.9, cy - r * 0.7);
      c.closePath();
      c.fill();
      c.stroke();
    }

    function drawCatEyeLens(c, cx, cy, r, dir) {
      c.beginPath();
      c.moveTo(cx - r * 0.85, cy);
      c.quadraticCurveTo(cx, cy - r * 0.9, cx + r * 0.9 * dir, cy - r * 1.1);
      c.quadraticCurveTo(cx + r * 0.9, cy + r * 0.8, cx, cy + r * 0.9);
      c.quadraticCurveTo(cx - r * 0.9, cy + r * 0.7, cx - r * 0.85, cy);
      c.closePath();
      c.fill();
      c.stroke();
    }

    // ─── 髮色渲染 ───
    function drawHairColor(c, lm, w, h, type) {
      c.save();
      c.globalCompositeOperation = 'soft-light';
      let gradColor = 'rgba(0,0,0,0)';
      if (type === 'ash-grey') gradColor = 'rgba(120, 140, 160, 0.55)';
      if (type === 'honey-brown') gradColor = 'rgba(217, 119, 6, 0.55)';
      if (type === 'berry-pink') gradColor = 'rgba(225, 29, 72, 0.45)';

      const crown = lm[10];
      const cx = crown.x * w;
      const cy = (crown.y * h) - 30;
      const radius = Math.hypot((lm[234].x - lm[454].x) * w, 0) * 0.85;

      const grad = c.createRadialGradient(cx, cy, radius * 0.2, cx, cy, radius);
      grad.addColorStop(0, gradColor);
      grad.addColorStop(1, 'rgba(0,0,0,0)');

      c.filter = 'blur(12px)';
      c.fillStyle = grad;
      c.beginPath();
      c.arc(cx, cy, radius, 0, Math.PI * 2);
      c.fill();
      c.restore();
    }

    // ─── 彩妝與睫毛 ───
    function drawEyeShadow(c, lm, indices, w, h, colorArr) {
      c.save();
      const alpha = Math.min(1.0, colorArr[3] * makeupIntensity).toFixed(2);
      c.filter = 'blur(6px)';
      c.globalCompositeOperation = 'soft-light';
      c.fillStyle = `rgba(${colorArr[0]}, ${colorArr[1]}, ${colorArr[2]}, ${alpha})`;
      c.beginPath();
      indices.forEach((idx, i) => {
        const pt = lm[idx];
        if (i === 0) c.moveTo(pt.x * w, pt.y * h - 4);
        else c.lineTo(pt.x * w, pt.y * h - 4);
      });
      c.closePath();
      c.fill();
      c.restore();
    }

    function drawBlush(c, pt, w, h, colorArr) {
      c.save();
      const cx = pt.x * w;
      const cy = pt.y * h;
      const radius = 36;
      const alpha = Math.min(0.8, colorArr[3] * makeupIntensity);
      c.globalCompositeOperation = 'soft-light';
      const grad = c.createRadialGradient(cx, cy, 3, cx, cy, radius);
      grad.addColorStop(0, `rgba(${colorArr[0]}, ${colorArr[1]}, ${colorArr[2]}, ${alpha})`);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      c.filter = 'blur(10px)';
      c.fillStyle = grad;
      c.beginPath();
      c.arc(cx, cy, radius, 0, Math.PI * 2);
      c.fill();
      c.restore();
    }

    function drawLip(c, lm, upper, lower, w, h, colorArr) {
      c.save();
      c.filter = 'blur(1.5px)';
      c.globalCompositeOperation = 'multiply';
      const alpha = Math.min(1.0, colorArr[3] * makeupIntensity).toFixed(2);
      c.fillStyle = `rgba(${colorArr[0]}, ${colorArr[1]}, ${colorArr[2]}, ${alpha})`;

      const path = new Path2D();
      upper.forEach((idx, i) => {
        const pt = lm[idx];
        if (i === 0) path.moveTo(pt.x * w, pt.y * h);
        else path.lineTo(pt.x * w, pt.y * h);
      });
      path.closePath();
      lower.forEach((idx, i) => {
        const pt = lm[idx];
        if (i === 0) path.moveTo(pt.x * w, pt.y * h);
        else path.lineTo(pt.x * w, pt.y * h);
      });
      path.closePath();
      c.fill(path, 'evenodd');

      c.globalCompositeOperation = 'screen';
      c.fillStyle = `rgba(255, 255, 255, ${0.2 * makeupIntensity})`;
      const hl = new Path2D();
      hl.arc(lm[17].x * w, lm[17].y * h - 3, 10, 0, Math.PI * 2);
      c.filter = 'blur(3px)';
      c.fill(hl);
      c.restore();
    }

    function drawEyelashes(c, lm, eyePts, w, h, type, isRight) {
      c.save();
      c.strokeStyle = '#1e1b18';
      c.lineCap = 'round';
      let lashLen = 6, lashWidth = 1.2, countStep = 2;
      if (type === 'sunflower') { lashLen = 10; lashWidth = 1.6; countStep = 1; }
      if (type === 'doll') { lashLen = 12; lashWidth = 2.0; countStep = 1; }
      c.lineWidth = lashWidth;

      for (let i = 1; i < eyePts.length - 1; i += countStep) {
        const p = lm[eyePts[i]];
        const prev = lm[eyePts[i - 1]];
        const next = lm[eyePts[i + 1]];
        const px = p.x * w;
        const py = p.y * h;
        const dx = (next.x - prev.x) * w;
        const dy = (next.y - prev.y) * h;
        const angle = Math.atan2(dy, dx);
        const normAngle = angle - Math.PI / 2;
        const tipX = px + Math.cos(normAngle) * lashLen + (isRight ? 2 : -2);
        const tipY = py + Math.sin(normAngle) * lashLen - 2;

        c.beginPath();
        c.moveTo(px, py);
        c.quadraticCurveTo(px, py - 3, tipX, tipY);
        c.stroke();
      }
      c.restore();
    }

    // ─── 耳環與髮夾 ───
    function drawEarring(c, lobe, w, h, style, isRight) {
      c.save();
      const lx = lobe.x * w;
      const ly = lobe.y * h;

      if (style === 'pearl') {
        c.fillStyle = '#f8fafc';
        c.shadowColor = 'rgba(0,0,0,0.3)';
        c.shadowBlur = 4;
        c.beginPath();
        c.arc(lx, ly + 2, 4.5, 0, Math.PI * 2);
        c.fill();
        c.fillStyle = '#ffffff';
        c.beginPath();
        c.arc(lx - 1.2, ly + 0.8, 1.5, 0, Math.PI * 2);
        c.fill();
      } else if (style === 'hoop') {
        c.strokeStyle = '#facc15';
        c.lineWidth = 2.5;
        c.shadowColor = 'rgba(0,0,0,0.35)';
        c.shadowBlur = 4;
        c.beginPath();
        c.arc(lx, ly + 14, 12, 0, Math.PI * 2);
        c.stroke();
      } else if (style === 'tassel') {
        c.strokeStyle = '#e2e8f0';
        c.lineWidth = 1.5;
        c.beginPath();
        c.moveTo(lx, ly);
        c.lineTo(lx, ly + 24);
        c.stroke();
        c.fillStyle = '#38bdf8';
        c.shadowColor = '#0284c7';
        c.shadowBlur = 5;
        c.beginPath();
        c.arc(lx, ly + 26, 3.5, 0, Math.PI * 2);
        c.fill();
      }
      c.restore();
    }

    function drawHairClip(c, lm, w, h, style) {
      c.save();
      const p1 = lm[103];
      const p2 = lm[67];
      const hx = ((p1.x + p2.x) / 2) * w - 10;
      const hy = ((p1.y + p2.y) / 2) * h - 18;

      if (style === 'pearl-bar') {
        for (let i = 0; i < 4; i++) {
          const px = hx + i * 8;
          const py = hy + i * 2.5;
          c.fillStyle = '#ffffff';
          c.shadowColor = 'rgba(0,0,0,0.3)';
          c.shadowBlur = 3;
          c.beginPath();
          c.arc(px, py, 3.8, 0, Math.PI * 2);
          c.fill();
        }
      } else if (style === 'metal-gold') {
        c.strokeStyle = '#fbbf24';
        c.lineWidth = 4;
        c.lineCap = 'round';
        c.shadowColor = 'rgba(0,0,0,0.4)';
        c.shadowBlur = 4;
        c.beginPath();
        c.moveTo(hx - 5, hy);
        c.lineTo(hx + 26, hy + 8);
        c.stroke();
      } else if (style === 'cross-pin') {
        c.strokeStyle = '#ec4899';
        c.lineWidth = 2.5;
        c.lineCap = 'round';
        c.beginPath();
        c.moveTo(hx - 8, hy - 8);
        c.lineTo(hx + 18, hy + 10);
        c.moveTo(hx + 18, hy - 8);
        c.lineTo(hx - 8, hy + 10);
        c.stroke();
      }
      c.restore();
    }

    // 分頁切換
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.classList.remove('active');
          b.classList.add('text-slate-400');
        });
        btn.classList.add('active');
        btn.classList.remove('text-slate-400');

        const tab = btn.dataset.tab;
        document.querySelectorAll('.pane-item').forEach(p => p.classList.add('hidden'));
        document.getElementById(`pane-${tab}`).classList.remove('hidden');
      };
    });

    // 項目切換
    document.querySelectorAll('.opt-chip').forEach(chip => {
      chip.onclick = () => {
        const type = chip.dataset.type;
        const val = chip.dataset.val;

        document.querySelectorAll(`.opt-chip[data-type="${type}"]`).forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        activeConfig[type] = val;
      };
    });

    intensitySlider.oninput = (e) => {
      makeupIntensity = parseFloat(e.target.value);
    };

    const hideMakeup = () => { hideAll = true; };
    const showMakeup = () => { hideAll = false; };
    compareBtn.addEventListener('mousedown', hideMakeup);
    compareBtn.addEventListener('mouseup', showMakeup);
    compareBtn.addEventListener('touchstart', hideMakeup, { passive: true });
    compareBtn.addEventListener('touchend', showMakeup, { passive: true });

    initFaceMesh();
  </script>
</body>
</html>
