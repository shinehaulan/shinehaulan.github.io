<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>美茉莉</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
    body {
      background-color: #121212;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px 16px 90px 16px;
    }

    /* 頂部天氣與時鐘看板 */
    .dashboard-card {
      width: 100%;
      max-width: 520px;
      background: linear-gradient(135deg, #1E293B, #0F172A);
      border: 2px solid #334155;
      border-radius: 18px;
      padding: 16px 20px;
      margin-bottom: 18px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .weather-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
    }
    .weather-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 26px;
      font-weight: bold;
      color: #38BDF8;
    }
    .weather-temp {
      font-size: 28px;
      color: #F8FAFC;
    }
    .datetime-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .date-text {
      font-size: 20px;
      color: #CBD5E1;
      font-weight: 500;
    }
    .time-text {
      font-size: 32px;
      font-weight: bold;
      color: #FDE047;
      letter-spacing: 1px;
    }

    /* 主標題 */
    header { text-align: center; margin-bottom: 16px; }
    h1 { font-size: 34px; color: #FFD54F; letter-spacing: 2px; }

    /* 操作卡片容器 */
    .app-card {
      width: 100%;
      max-width: 520px;
      background-color: #1E1E1E;
      border: 2px solid #37474F;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      margin-bottom: 20px;
    }

    .section-label { font-size: 20px; color: #90A4AE; margin-bottom: 12px; font-weight: bold; }
    
    /* 分類九宮格 */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .cat-btn {
      background-color: #263238;
      border: 2px solid #455A64;
      color: #ECEFF1;
      font-size: 19px;
      font-weight: bold;
      padding: 14px 6px;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      -webkit-tap-highlight-color: transparent;
    }
    .cat-btn.active {
      background-color: #00695C;
      border-color: #80CBC4;
      color: #FFFFFF;
      box-shadow: 0 0 12px rgba(128, 203, 196, 0.4);
    }
    .cat-btn span.icon { font-size: 28px; }

    /* 輸入區 */
    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }
    .text-input {
      flex: 1;
      background-color: #2A2A2A;
      border: 2px solid #455A64;
      border-radius: 12px;
      color: #FFFFFF;
      font-size: 22px;
      padding: 12px 14px;
      outline: none;
    }
    .text-input:focus { border-color: #FFD54F; }
    
    .mic-btn-small {
      width: 68px;
      background: linear-gradient(145deg, #2E7D32, #1B5E20);
      border: 2px solid #81C784;
      border-radius: 12px;
      color: #FFF;
      font-size: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .mic-btn-small.recording {
      background: linear-gradient(145deg, #C62828, #8E0000);
      border-color: #FF8A80;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(229, 57, 53, 0.7); }
      70% { box-shadow: 0 0 0 12px rgba(229, 57, 53, 0); }
      100% { box-shadow: 0 0 0 0 rgba(229, 57, 53, 0); }
    }

    /* 時間與新增 */
    .time-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
    }
    .time-label { font-size: 18px; color: #CFD8DC; white-space: nowrap; }
    .time-picker {
      background-color: #2A2A2A;
      border: 2px solid #455A64;
      border-radius: 10px;
      color: #FFFFFF;
      font-size: 20px;
      padding: 8px 10px;
      flex: 1;
    }
    .add-btn {
      width: 100%;
      background-color: #E65100;
      border: 2px solid #FFB74D;
      color: #FFFFFF;
      font-size: 24px;
      font-weight: bold;
      padding: 14px;
      border-radius: 12px;
      cursor: pointer;
    }

    /* 備忘清單卡片 */
    .list-container { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 14px; }
    .note-card {
      background-color: #1E1E1E;
      border: 2px solid #37474F;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .cat-tag {
      font-size: 14px;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 6px;
    }
    .tag-吃藥 { background-color: #C62828; color: #FFF; }
    .tag-回診 { background-color: #1565C0; color: #FFF; }
    .tag-健身 { background-color: #2E7D32; color: #FFF; }
    .tag-心靈 { background-color: #6A1B9A; color: #FFF; }
    .tag-日常 { background-color: #455A64; color: #FFF; }

    .note-text { font-size: 23px; color: #FFFFFF; font-weight: bold; line-height: 1.3; }
    .note-alarm { font-size: 17px; color: #FFB74D; margin-top: 6px; }
    .card-actions { display: flex; flex-direction: column; gap: 8px; }
    .btn-speak { background: #37474F; border: 1px solid #78909C; color: #FFF; padding: 8px 12px; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .btn-del { background: #263238; border: 1px solid #B71C1C; color: #FF8A80; padding: 8px 12px; border-radius: 8px; font-size: 16px; cursor: pointer; }

    /* 底部合規廣告位 */
    .ad-fixed-bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background-color: #000;
      border-top: 1px solid #333;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      font-size: 13px;
      color: #757575;
    }
  </style>
</head>
<body>

  <!-- 最上層：即時天氣與日期時間看板 -->
  <div class="dashboard-card">
    <div class="weather-row">
      <div class="weather-info">
        <span id="weather-icon">⛅</span>
        <span id="weather-desc">載入天氣中...</span>
      </div>
      <div class="weather-temp" id="weather-temp">--°C</div>
    </div>
    <div class="datetime-row">
      <div class="date-text" id="current-date">--月--日 星期-</div>
      <div class="time-text" id="current-time">00:00:00</div>
    </div>
  </div>

  <header>
    <h1>美茉莉</h1>
  </header>

  <div class="app-card">
    <div class="section-label">1. 選擇要記的事情：</div>
    <div class="category-grid">
      <button class="cat-btn active" onclick="selectCat('吃藥', '💊', this)">
        <span class="icon">💊</span>吃藥
      </button>
      <button class="cat-btn" onclick="selectCat('回診', '🏥', this)">
        <span class="icon">🏥</span>回診
      </button>
      <button class="cat-btn" onclick="selectCat('健身', '🏃', this)">
        <span class="icon">🏃</span>健身運動
      </button>
      <button class="cat-btn" onclick="selectCat('心靈', '🌸', this)">
        <span class="icon">🌸</span>心靈放鬆
      </button>
      <button class="cat-btn" onclick="selectCat('日常', '📝', this)">
        <span class="icon">📝</span>一般日常
      </button>
      <!-- 保留便民長照與輔具服務電話 -->
      <a href="tel:1966" class="cat-btn" style="text-decoration:none;">
        <span class="icon">📞</span>長照專線
      </a>
    </div>

    <div class="section-label">2. 說話或打字輸入：</div>
    <div class="input-row">
      <input type="text" id="note-input" class="text-input" placeholder="例如：晚上吃降血壓藥">
      <button class="mic-btn-small" id="mic-btn" onclick="toggleRecord()" title="按一下用講的">🎙️</button>
    </div>

    <div class="time-row">
      <span class="time-label">⏰ 提醒時間：</span>
      <input type="time" id="alarm-time" class="time-picker">
    </div>

    <button class="add-btn" onclick="addNote()">＋ 記下來並設定提醒</button>
  </div>

  <div class="list-container">
    <div style="font-size: 22px; color: #ECEFF1; border-bottom: 2px solid #37474F; padding-bottom: 8px;">
      📋 記下的行程清單
    </div>
    <div id="notes-list"></div>
  </div>

  <!-- 底部固定合規廣告欄 -->
  <div class="ad-fixed-bottom">
    [ 贊助廣告版位 · 零個資留存安全認證 ]
  </div>

  <script>
    const STORAGE_KEY = 'senior_care_notes_v3';
    let currentCategory = '吃藥';
    let isRecording = false;
    let recognition = null;
    let notifiedIds = new Set();

    // 1. 即時時鐘與日期更新
    function updateClock() {
      const now = new Date();
      const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const m = now.getMonth() + 1;
      const d = now.getDate();
      const day = weekdays[now.getDay()];

      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');

      document.getElementById('current-date').innerText = `${m}月${d}日 ${day}`;
      document.getElementById('current-time').innerText = `${hh}:${mm}:${ss}`;

      // 檢查鬧鐘
      const currentHHMM = `${hh}:${mm}`;
      const notes = getNotes();
      notes.forEach(note => {
        if (note.time === currentHHMM) {
          const alarmKey = `${note.id}-${currentHHMM}`;
          if (!notifiedIds.has(alarmKey)) {
            notifiedIds.add(alarmKey);
            const alarmMsg = `時間到了！提醒您，${note.category}：${note.text}`;
            speak(alarmMsg);
            alert(`【時間到了提醒】\n\n類別：${note.category}\n內容：${note.text}`);
          }
        }
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. 取得天氣資訊（純前端免費 Open-Meteo API，零金鑰，高隱私）
    function fetchWeather(lat = 25.04, lon = 121.28) { // 預設北台灣坐標
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
        .then(res => res.json())
        .then(data => {
          if (data && data.current_weather) {
            const temp = Math.round(data.current_weather.temperature);
            const code = data.current_weather.weathercode;
            const weatherDesc = getWeatherText(code);
            document.getElementById('weather-temp').innerText = `${temp}°C`;
            document.getElementById('weather-desc').innerText = weatherDesc.text;
            document.getElementById('weather-icon').innerText = weatherDesc.icon;
          }
        })
        .catch(() => {
          document.getElementById('weather-desc').innerText = '多雲時晴';
          document.getElementById('weather-temp').innerText = '舒適';
        });
    }

    function getWeatherText(code) {
      if (code === 0) return { text: '晴天', icon: '☀️' };
      if ([1, 2, 3].includes(code)) return { text: '多雲晴', icon: '⛅' };
      if ([45, 48].includes(code)) return { text: '起霧', icon: '🌫️' };
      if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return { text: '陰有雨', icon: '🌧️' };
      if ([95, 96, 99].includes(code)) return { text: '雷陣雨', icon: '⛈️' };
      return { text: '陰天', icon: '☁️' };
    }

    // 嘗試取得使用者所在位置的天氣
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => fetchWeather(pos.coords.latitude, pos.coords.longitude),
        () => fetchWeather() // 拒絕位置授權則載入預設
      );
    } else {
      fetchWeather();
    }

    // 3. 分類切換
    function selectCat(cat, icon, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const input = document.getElementById('note-input');
      if (cat === '吃藥') input.placeholder = '例如：晚上吃降血壓藥';
      else if (cat === '回診') input.placeholder = '例如：下午三點醫院心臟科';
      else if (cat === '健身') input.placeholder = '例如：公園散步30分鐘';
      else if (cat === '心靈') input.placeholder = '例如：聽佛經、打給老友聊天';
      else input.placeholder = '請輸入或用講的...';
    }

    // 4. 語音辨識
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.lang = 'zh-TW';

      recognition.onstart = () => {
        isRecording = true;
        const mic = document.getElementById('mic-btn');
        mic.classList.add('recording');
        mic.innerText = '🔴';
      };

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript.trim();
        document.getElementById('note-input').value = text;
      };

      recognition.onend = () => {
        isRecording = false;
        const mic = document.getElementById('mic-btn');
        mic.classList.remove('recording');
        mic.innerText = '🎙️';
      };

      recognition.onerror = () => {
        isRecording = false;
        document.getElementById('mic-btn').classList.remove('recording');
        document.getElementById('mic-btn').innerText = '🎙️';
        speak("沒有聽清楚，請再按一次說話。");
      };
    }

    function toggleRecord() {
      if (!recognition) {
        alert("此手機瀏覽器不支援語音辨識，請直接打字。");
        return;
      }
      if (isRecording) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    // 5. 語音朗讀
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'zh-TW';
        utter.rate = 0.85;
        window.speechSynthesis.speak(utter);
      }
    }

    // 6. 新增與儲存
    function addNote() {
      const input = document.getElementById('note-input');
      const timeInput = document.getElementById('alarm-time');
      const text = input.value.trim();

      if (!text) {
        speak("請先說話或輸入內容");
        return;
      }

      const notes = getNotes();
      const newNote = {
        id: Date.now(),
        category: currentCategory,
        text: text,
        time: timeInput.value || '',
        createdDate: new Date().toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric' })
      };

      notes.unshift(newNote);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));

      input.value = '';
      timeInput.value = '';
      render();

      let confirmMsg = `已記下${newNote.category}：${newNote.text}`;
      if (newNote.time) confirmMsg += `，將在 ${newNote.time} 提醒`;
      speak(confirmMsg);
    }

    function getNotes() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    }

    function deleteNote(id) {
      const notes = getNotes().filter(n => n.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
      render();
    }

    function render() {
      const listEl = document.getElementById('notes-list');
      const notes = getNotes();

      if (notes.length === 0) {
        listEl.innerHTML = '<div style="color:#78909C; text-align:center; margin-top:20px; font-size:20px;">目前沒有任何備忘事項</div>';
        return;
      }

      listEl.innerHTML = notes.map(n => `
        <div class="note-card">
          <div style="flex:1;">
            <span class="cat-tag tag-${n.category}">${n.category}</span>
            <div class="note-text">${n.text}</div>
            <div class="note-alarm">${n.time ? '⏰ 提醒時間：' + n.time : '📅 記於：' + n.createdDate}</div>
          </div>
          <div class="card-actions">
            <button class="btn-speak" onclick="speak('${n.category}提醒：${n.text}')">🔊 念出來</button>
            <button class="btn-del" onclick="deleteNote(${n.id})">刪除</button>
          </div>
        </div>
      `).join('');
    }

    render();
  </script>
</body>
</html>
