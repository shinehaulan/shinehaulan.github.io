<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AuraTimeline - 微觀皮膚時光機</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    .split-container {
      position: relative;
      overflow: hidden;
    }
    .split-after {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      overflow: hidden;
      border-right: 2px solid #38bdf8;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-3 selection:bg-pink-500 font-sans">

  <!-- 頂部 Header -->
  <header class="w-full max-w-md flex items-center justify-between pb-3 border-b border-slate-800">
    <div>
      <h1 class="text-base font-bold text-white tracking-wide">AuraTimeline</h1>
      <p class="text-[10px] text-slate-400">微觀皮膚變化時光對齊系統</p>
    </div>
    <div id="step-badge" class="px-2.5 py-1 rounded-full bg-slate-800 text-[11px] font-medium text-pink-400 border border-slate-700">
      階段 1：建立基準照
    </div>
  </header>

  <main class="w-full max-w-md mt-3 flex flex-col items-center space-y-4">
    
    <!-- 視訊 / 拍照操作視窗 -->
    <div id="camera-section" class="relative w-full aspect-[3/4] rounded-2xl overflow-hidden bg-slate-900 border border-slate-800 shadow-2xl">
      <video id="webcam" class="absolute inset-0 w-full h-full object-cover transform -scale-x-100" playsinline></video>
      <canvas id="ar-canvas" class="absolute inset-0 w-full h-full object-cover transform -scale-x-100"></canvas>

      <!-- 頂部姿態吻合度儀表板 -->
      <div id="alignment-bar" class="absolute top-3 inset-x-4 bg-slate-900/90 backdrop-blur-md border border-slate-700 p-2 rounded-xl flex items-center justify-between shadow-lg">
        <div class="flex items-center space-x-2">
          <span id="lock-dot" class="w-2.5 h-2.5 rounded-full bg-slate-500"></span>
          <span id="align-text" class="text-xs font-bold text-slate-300">請將臉部置於中央</span>
        </div>
        <div id="match-score" class="font-mono text-xs font-extrabold text-slate-400">0%</div>
      </div>

      <!-- 操作按鈕 -->
      <div class="absolute bottom-4 inset-x-0 flex justify-center items-center space-x-3 px-4 z-10">
        <button id="capture-base-btn" class="px-6 py-2.5 rounded-full bg-gradient-to-r from-pink-500 to-rose-600 text-white font-bold text-xs shadow-lg flex items-center space-x-1.5 transition-all">
          <i data-lucide="camera" class="w-4 h-4"></i>
          <span>拍攝基準照 (2025)</span>
        </button>
        <button id="capture-align-btn" disabled class="hidden px-6 py-2.5 rounded-full bg-emerald-600 text-white font-bold text-xs shadow-lg disabled:opacity-30 disabled:cursor-not-allowed flex items-center space-x-1.5 transition-all">
          <i data-lucide="scan" class="w-4 h-4"></i>
          <span>姿態鎖定拍照 (2026)</span>
        </button>
      </div>
    </div>

    <!-- 比對與分析結果視窗 (完成兩次拍攝後解鎖) -->
    <div id="analysis-section" class="hidden w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-4">
      <div class="flex items-center justify-between pb-2 border-b border-slate-800">
        <div>
          <span class="text-[10px] text-pink-400 font-semibold tracking-wider uppercase">微觀局部對齊分析</span>
          <h2 class="text-sm font-bold text-white mt-0.5">左臉頰 ROI 特寫 (放大 3.5x)</h2>
        </div>
        <div class="flex space-x-2">
          <button id="toggle-blink-btn" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-pink-300 border border-slate-700 flex items-center space-x-1">
            <i data-lucide="eye" class="w-3.5 h-3.5"></i>
            <span>閃爍比對</span>
          </button>
        </div>
      </div>

      <!-- 劃開式比對透視畫布 (Split Slider Container) -->
      <div class="relative w-full aspect-square rounded-xl overflow-hidden bg-slate-950 border border-slate-800 split-container">
        <!-- 底層：基準照局部 (2025) -->
        <canvas id="roi-base-canvas" class="absolute inset-0 w-full h-full object-cover"></canvas>
        
        <!-- 上層：新照局部 (2026) + 差異標記 -->
        <div id="split-wrapper" class="split-after w-1/2">
          <canvas id="roi-target-canvas" class="absolute top-0 left-0 h-full max-w-none"></canvas>
        </div>

        <div class="absolute bottom-2 left-2 px-2 py-0.5 rounded bg-black/60 text-[10px] text-slate-300 font-mono">2025 基準</div>
        <div class="absolute bottom-2 right-2 px-2 py-0.5 rounded bg-black/60 text-[10px] text-pink-400 font-mono">2026 對比</div>
      </div>

      <!-- 比對控制滑桿 -->
      <div class="space-y-1">
        <div class="flex justify-between text-[11px] text-slate-400">
          <span>滑動透視對比</span>
          <span id="slider-val-txt">50%</span>
        </div>
        <input id="split-slider" type="range" min="0" max="100" value="50" class="w-full accent-pink-500 bg-slate-800 rounded-lg h-2 cursor-pointer">
      </div>

      <!-- 差異分析結果統計標籤 -->
      <div class="grid grid-cols-2 gap-2 text-xs">
        <div class="bg-rose-950/20 border border-rose-900/40 p-2.5 rounded-xl flex items-center space-x-2">
          <span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>
          <div>
            <div class="text-[10px] text-slate-400">新增暗色點 (新斑/痣)</div>
            <div id="new-spots-count" class="font-bold text-rose-400 mt-0.5">0 處</div>
          </div>
        </div>
        <div class="bg-emerald-950/20 border border-emerald-900/40 p-2.5 rounded-xl flex items-center space-x-2">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
          <div>
            <div class="text-[10px] text-slate-400">淡化區域</div>
            <div id="faded-spots-count" class="font-bold text-emerald-400 mt-0.5">0 處</div>
          </div>
        </div>
      </div>

      <button id="reset-system-btn" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-medium transition-all">
        重設重新測試
      </button>
    </div>

  </main>

  <script>
    lucide.createIcons();

    const video = document.getElementById('webcam');
    const arCanvas = document.getElementById('ar-canvas');
    const arCtx = arCanvas.getContext('2d');

    const alignText = document.getElementById('align-text');
    const matchScore = document.getElementById('match-score');
    const lockDot = document.getElementById('lock-dot');
    const stepBadge = document.getElementById('step-badge');

    const captureBaseBtn = document.getElementById('capture-base-btn');
    const captureAlignBtn = document.getElementById('capture-align-btn');
    const cameraSection = document.getElementById('camera-section');
    const analysisSection = document.getElementById('analysis-section');

    const roiBaseCanvas = document.getElementById('roi-base-canvas');
    const roiTargetCanvas = document.getElementById('roi-target-canvas');
    const splitWrapper = document.getElementById('split-wrapper');
    const splitSlider = document.getElementById('split-slider');
    const toggleBlinkBtn = document.getElementById('toggle-blink-btn');
    const resetSystemBtn = document.getElementById('reset-system-btn');
    const newSpotsCount = document.getElementById('new-spots-count');
    const fadedSpotsCount = document.getElementById('faded-spots-count');

    // 系統狀態變數
    let currentPhase = 'BASELINE'; // 'BASELINE' | 'ALIGNING' | 'DONE'
    let baselinePose = null;
    let baselineImage = null;
    let baselineLandmarks = null;
    let alignedTargetImage = null;
    let currentLandmarks = null;
    let blinkInterval = null;

    // MediaPipe 初始化
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });
    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.65
    });
    faceMesh.onResults(onFrameResults);

    // 3D 姿態估計解算器
    function calculateFacePose(lm, w, h) {
      const pLeftEye = lm[468];  // 左瞳孔
      const pRightEye = lm[473]; // 右瞳孔
      const pNose = lm[1];       // 鼻尖
      const pTopNose = lm[168];  // 鼻樑
      const pChin = lm[152];     // 下巴
      const pLeftCheek = lm[234]; // 左側臉輪廓
      const pRightCheek = lm[454];// 右側臉輪廓

      // 1. 瞳孔歐氏距離 (Scale 尺度基準)
      const eyeDx = (pRightEye.x - pLeftEye.x) * w;
      const eyeDy = (pRightEye.y - pLeftEye.y) * h;
      const eyeDistance = Math.hypot(eyeDx, eyeDy);

      // 2. 左右滾轉角 (Roll)
      const rollAngle = Math.atan2(eyeDy, eyeDx);

      // 3. 左右偏航角 (Yaw 對稱比)
      const distL = Math.abs(pNose.x - pLeftCheek.x);
      const distR = Math.abs(pRightCheek.x - pNose.x);
      const yawRatio = distL / (distR || 1e-4);

      // 4. 上下俯仰角 (Pitch 垂直比)
      const distNoseTop = Math.abs(pNose.y - pTopNose.y);
      const distNoseChin = Math.abs(pChin.y - pNose.y);
      const pitchRatio = distNoseTop / (distNoseChin || 1e-4);

      return {
        eyeDistance,
        rollAngle,
        yawRatio,
        pitchRatio,
        center: { x: ((pLeftEye.x + pRightEye.x) / 2) * w, y: ((pLeftEye.y + pRightEye.y) / 2) * h }
      };
    }

    function onFrameResults(results) {
      if (currentPhase === 'DONE') return;

      arCanvas.width = video.videoWidth;
      arCanvas.height = video.videoHeight;
      arCtx.clearRect(0, 0, arCanvas.width, arCanvas.height);

      if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
        alignText.innerText = "未偵測到人臉";
        matchScore.innerText = "0%";
        lockDot.className = "w-2.5 h-2.5 rounded-full bg-slate-500";
        captureAlignBtn.disabled = true;
        return;
      }

      const lm = results.multiFaceLandmarks[0];
      const w = arCanvas.width;
      const h = arCanvas.height;
      currentLandmarks = lm;

      const currentPose = calculateFacePose(lm, w, h);

      if (currentPhase === 'BASELINE') {
        alignText.innerText = "放鬆表情，拍下第一張基準照";
        matchScore.innerText = "READY";
        lockDot.className = "w-2.5 h-2.5 rounded-full bg-pink-500 animate-ping";
        drawLandmarkHull(arCtx, lm, w, h, 'rgba(236, 72, 153, 0.4)');
      } 
      else if (currentPhase === 'ALIGNING' && baselinePose) {
        // 繪製半透明基準照鬼影網格 (Ghost Overlay)
        drawLandmarkHull(arCtx, baselineLandmarks, w, h, 'rgba(16, 185, 129, 0.25)');

        // 比對四項特徵偏差
        const scaleDiff = Math.abs(currentPose.eyeDistance - baselinePose.eyeDistance) / baselinePose.eyeDistance;
        const rollDiff = Math.abs(currentPose.rollAngle - baselinePose.rollAngle);
        const yawDiff = Math.abs(currentPose.yawRatio - baselinePose.yawRatio);
        const pitchDiff = Math.abs(currentPose.pitchRatio - baselinePose.pitchRatio);

        // 吻合度指數 (權重加權)
        const totalError = (scaleDiff * 0.4) + (rollDiff * 0.2) + (yawDiff * 0.2) + (pitchDiff * 0.2);
        const matchPercent = Math.max(0, Math.min(100, Math.round((1 - totalError * 2.5) * 100)));
        matchScore.innerText = `${matchPercent}%`;

        if (matchPercent >= 93) {
          alignText.innerText = "五官角度完美重合，請保持不動";
          lockDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-lg shadow-emerald-500/50";
          captureAlignBtn.disabled = false;
          drawLandmarkHull(arCtx, lm, w, h, 'rgba(16, 185, 129, 0.8)');
        } else {
          alignText.innerText = "請微調頭部角度對準綠色網格";
          lockDot.className = "w-2.5 h-2.5 rounded-full bg-rose-500";
          captureAlignBtn.disabled = true;
          drawLandmarkHull(arCtx, lm, w, h, 'rgba(244, 63, 94, 0.5)');
        }
      }
    }

    function drawLandmarkHull(ctx, lm, w, h, color) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      const faceOval = [10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 378, 400, 377, 152, 148, 176, 149, 150, 136, 172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109, 10];
      faceOval.forEach((idx, i) => {
        const pt = lm[idx];
        if (i === 0) ctx.moveTo(pt.x * w, pt.y * h);
        else ctx.lineTo(pt.x * w, pt.y * h);
      });
      ctx.stroke();
    }

    // 拍下基準照 (2025)
    captureBaseBtn.onclick = () => {
      if (!currentLandmarks) return;

      const w = video.videoWidth;
      const h = video.videoHeight;

      // 離屏畫布抓拍
      const offCanvas = document.createElement('canvas');
      offCanvas.width = w;
      offCanvas.height = h;
      const offCtx = offCanvas.getContext('2d');
      offCtx.save();
      offCtx.translate(w, 0);
      offCtx.scale(-1, 1);
      offCtx.drawImage(video, 0, 0, w, h);
      offCtx.restore();

      baselineImage = offCanvas;
      baselineLandmarks = JSON.parse(JSON.stringify(currentLandmarks));
      baselinePose = calculateFacePose(baselineLandmarks, w, h);

      currentPhase = 'ALIGNING';
      stepBadge.innerText = "階段 2：對齊舊照姿態";
      captureBaseBtn.classList.add('hidden');
      captureAlignBtn.classList.remove('hidden');
      alignText.innerText = "載入基準姿態中，請對準綠線";
    };

    // 拍下對齊照 (2026) 並啟動像素運算
    captureAlignBtn.onclick = () => {
      const w = video.videoWidth;
      const h = video.videoHeight;

      // 拍下當前畫面
      const currentCanvas = document.createElement('canvas');
      currentCanvas.width = w;
      currentCanvas.height = h;
      const cCtx = currentCanvas.getContext('2d');
      cCtx.save();
      cCtx.translate(w, 0);
      cCtx.scale(-1, 1);
      cCtx.drawImage(video, 0, 0, w, h);
      cCtx.restore();

      // 仿射剛性對齊：將 currentCanvas 強制對齊到 baselineImage
      alignedTargetImage = alignImagesByEyes(currentCanvas, currentLandmarks, baselineLandmarks, w, h);

      currentPhase = 'DONE';
      cameraSection.classList.add('hidden');
      analysisSection.classList.remove('hidden');
      stepBadge.innerText = "分析完成：微觀對照";

      // 擷取左臉頰局部 ROI 並做像差運算
      processCheekROI(baselineImage, alignedTargetImage, baselineLandmarks, w, h);
    };

    // 依瞳孔位置進行仿射變換校正
    function alignImagesByEyes(srcCanvas, srcLm, dstLm, w, h) {
      const resultCanvas = document.createElement('canvas');
      resultCanvas.width = w;
      resultCanvas.height = h;
      const rCtx = resultCanvas.getContext('2d');

      const srcP1 = { x: (1 - srcLm[468].x) * w, y: srcLm[468].y * h };
      const srcP2 = { x: (1 - srcLm[473].x) * w, y: srcLm[473].y * h };
      const dstP1 = { x: (1 - dstLm[468].x) * w, y: dstLm[468].y * h };
      const dstP2 = { x: (1 - dstLm[473].x) * w, y: dstLm[473].y * h };

      const srcAngle = Math.atan2(srcP2.y - srcP1.y, srcP2.x - srcP1.x);
      const dstAngle = Math.atan2(dstP2.y - dstP1.y, dstP2.x - dstP1.x);
      const rotation = dstAngle - srcAngle;

      const srcDist = Math.hypot(srcP2.x - srcP1.x, srcP2.y - srcP1.y);
      const dstDist = Math.hypot(dstP2.x - dstP1.x, dstP2.y - dstP1.y);
      const scale = dstDist / (srcDist || 1);

      rCtx.save();
      rCtx.translate(dstP1.x, dstP1.y);
      rCtx.rotate(rotation);
      rCtx.scale(scale, scale);
      rCtx.translate(-srcP1.x, -srcP1.y);
      rCtx.drawImage(srcCanvas, 0, 0);
      rCtx.restore();

      return resultCanvas;
    }

    // 微觀臉頰 ROI 差分運算
    function processCheekROI(baseImg, targetImg, lm, w, h) {
      const roiSize = 140; // 局部裁切方塊尺寸
      // 以左臉頰中心點 116 為 ROI 錨點
      const cheekX = Math.round((1 - lm[116].x) * w - roiSize / 2);
      const cheekY = Math.round(lm[116].y * h - roiSize / 2);

      roiBaseCanvas.width = roiSize;
      roiBaseCanvas.height = roiSize;
      roiTargetCanvas.width = roiSize;
      roiTargetCanvas.height = roiSize;

      const bCtx = roiBaseCanvas.getContext('2d');
      const tCtx = roiTargetCanvas.getContext('2d');

      // 繪製局部放大影像
      bCtx.drawImage(baseImg, cheekX, cheekY, roiSize, roiSize, 0, 0, roiSize, roiSize);
      tCtx.drawImage(targetImg, cheekX, cheekY, roiSize, roiSize, 0, 0, roiSize, roiSize);

      // 像素差分運算
      const baseData = bCtx.getImageData(0, 0, roiSize, roiSize);
      const targetData = tCtx.getImageData(0, 0, roiSize, roiSize);
      const bPixels = baseData.data;
      const tPixels = targetData.data;

      let newCount = 0;
      let fadeCount = 0;

      // 像素級逐點比對
      for (let y = 10; y < roiSize - 10; y += 4) {
        for (let x = 10; x < roiSize - 10; x += 4) {
          const idx = (y * roiSize + x) * 4;
          // 灰階亮度 L = 0.299R + 0.587G + 0.114B
          const bLum = 0.299 * bPixels[idx] + 0.587 * bPixels[idx+1] + 0.114 * bPixels[idx+2];
          const tLum = 0.299 * tPixels[idx] + 0.587 * tPixels[idx+1] + 0.114 * tPixels[idx+2];

          const diff = tLum - bLum;

          // 🔴 變暗沉澱 (新長出來的斑/痣)
          if (diff < -38 && tLum < 120) {
            drawMarkCircle(tCtx, x, y, '#f43f5e'); // 紅圈
            newCount++;
          }
          // 🟢 變亮淡化
          else if (diff > 38 && bLum < 120) {
            drawMarkCircle(tCtx, x, y, '#10b981'); // 綠圈
            fadeCount++;
          }
        }
      }

      newSpotsCount.innerText = `${Math.min(5, newCount)} 處`;
      fadedSpotsCount.innerText = `${Math.min(5, fadeCount)} 處`;

      // 綁定比對畫布尺寸
      updateSplitView(50);
    }

    function drawMarkCircle(ctx, x, y, color) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, 6, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // 滑桿劃開更新 (Split Slider)
    function updateSplitView(val) {
      splitWrapper.style.width = `${val}%`;
      roiTargetCanvas.style.width = `${roiBaseCanvas.clientWidth}px`;
      roiTargetCanvas.style.height = `${roiBaseCanvas.clientHeight}px`;
    }

    splitSlider.oninput = (e) => {
      const val = e.target.value;
      document.getElementById('slider-val-txt').innerText = `${val}%`;
      updateSplitView(val);
    };

    // 交替閃爍比對 (Blink Match)
    toggleBlinkBtn.onclick = () => {
      if (blinkInterval) {
        clearInterval(blinkInterval);
        blinkInterval = null;
        toggleBlinkBtn.classList.remove('bg-pink-600', 'text-white');
        updateSplitView(splitSlider.value);
      } else {
        toggleBlinkBtn.classList.add('bg-pink-600', 'text-white');
        let showTarget = true;
        blinkInterval = setInterval(() => {
          updateSplitView(showTarget ? 100 : 0);
          showTarget = !showTarget;
        }, 350);
      }
    };

    resetSystemBtn.onclick = () => {
      currentPhase = 'BASELINE';
      baselinePose = null;
      baselineImage = null;
      baselineLandmarks = null;
      if (blinkInterval) clearInterval(blinkInterval);
      cameraSection.classList.remove('hidden');
      analysisSection.classList.add('hidden');
      captureBaseBtn.classList.remove('hidden');
      captureAlignBtn.classList.add('hidden');
      stepBadge.innerText = "階段 1：建立基準照";
    };

    // 啟動鏡頭
    const camera = new Camera(video, {
      onFrame: async () => {
        await faceMesh.send({ image: video });
      },
      width: 640,
      height: 480
    });
    camera.start();
  </script>
</body>
</html>
