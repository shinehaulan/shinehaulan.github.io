<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AuraFit Ultra - 極致精準尺寸校正系統</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    .mode-tab.active {
      background-color: #2563eb;
      color: #ffffff;
      box-shadow: 0 0 14px rgba(37, 99, 235, 0.45);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-2 sm:p-4 font-sans selection:bg-blue-500 select-none">

  <!-- 頂部標頭 -->
  <header class="w-full max-w-md flex items-center justify-between pb-2 border-b border-slate-800">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center font-bold text-white shadow-lg text-sm">
        Fit
      </div>
      <div>
        <h1 class="text-sm font-bold text-white tracking-wide">極致精準尺寸校正系統</h1>
        <p class="text-[9px] text-slate-400">水平防歪儀・2x準心放大鏡・D-Pad像素微調</p>
      </div>
    </div>
    <span id="level-badge" class="px-2 py-0.5 rounded-full bg-slate-900 border border-slate-700 text-[10px] text-slate-400 font-semibold flex items-center space-x-1">
      <span id="level-dot" class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
      <span id="level-text">水平校準中</span>
    </span>
  </header>

  <main class="w-full max-w-md mt-2 flex flex-col items-center space-y-3">

    <!-- 模式切換 -->
    <div class="w-full grid grid-cols-2 gap-1.5 bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs font-semibold">
      <button id="tab-foot" class="mode-tab active py-2 rounded-lg transition-all flex items-center justify-center space-x-1.5">
        <i data-lucide="footprints" class="w-4 h-4"></i>
        <span>買鞋量足（防退貨）</span>
      </button>
      <button id="tab-hand" class="mode-tab py-2 rounded-lg text-slate-400 transition-all flex items-center justify-center space-x-1.5">
        <i data-lucide="hand" class="w-4 h-4"></i>
        <span>手套量掌（防夾手）</span>
      </button>
    </div>

    <!-- 拍照與畫布視窗 -->
    <div class="relative w-full aspect-[3/4] rounded-2xl overflow-hidden bg-slate-900 border border-slate-800 shadow-2xl flex items-center justify-center">
      <!-- 修正：加上 playsinline, autoplay, muted, webkit-playsinline 防止 Android 黑屏拒播 -->
      <video id="webcam" playsinline autoplay muted webkit-playsinline class="absolute inset-0 w-full h-full object-cover"></video>
      <canvas id="measure-canvas" class="absolute inset-0 w-full h-full object-cover z-10 touch-none"></canvas>

      <!-- 2x 浮動準心放大鏡 -->
      <canvas id="loupe-canvas" width="140" height="140" class="hidden absolute top-4 left-4 z-40 rounded-full border-2 border-white shadow-2xl bg-black pointer-events-none"></canvas>

      <!-- 雙軸水平儀 -->
      <div id="bubble-level" class="absolute z-20 pointer-events-none flex flex-col items-center justify-center">
        <div class="w-16 h-16 rounded-full border-2 border-slate-400/40 bg-black/30 backdrop-blur-sm relative flex items-center justify-center">
          <div class="w-4 h-4 rounded-full border border-sky-400/60"></div>
          <div id="bubble-dot" class="w-3.5 h-3.5 rounded-full bg-rose-500 absolute transition-transform duration-75 shadow-md"></div>
        </div>
        <span id="bubble-hint" class="text-[10px] text-rose-300 font-bold bg-slate-950/80 px-2 py-0.5 rounded-md mt-1 shadow">
          請放平手機 (垂直朝下)
        </span>
      </div>

      <!-- 取景引導框 -->
      <div id="viewfinder-box" class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-between p-5">
        <div class="w-32 h-20 border-2 border-dashed border-sky-400/70 rounded-lg p-1 bg-sky-500/10 text-[10px] text-sky-300 font-mono">
          [ 健保卡/悠遊卡放置處 ]
        </div>
        <div class="self-end w-40 h-64 border-2 border-dashed border-emerald-400/60 rounded-2xl p-2 bg-emerald-500/10 text-[10px] text-emerald-300 text-center flex items-center justify-center">
          <span id="guide-target-text">[ 腳掌平放此區域 ]</span>
        </div>
      </div>

      <!-- 拍照前控制鈕 -->
      <div id="cam-controls" class="absolute bottom-4 inset-x-0 flex justify-center items-center space-x-3 px-4 z-20">
        <button id="snap-btn" class="px-6 py-2.5 rounded-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-lg shadow-emerald-600/30 flex items-center space-x-1.5 active:scale-95 transition-all">
          <i data-lucide="camera" class="w-4 h-4"></i>
          <span id="snap-text">定格拍照量測</span>
        </button>
        <label class="px-4 py-2.5 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs border border-slate-700 cursor-pointer flex items-center space-x-1.5">
          <i data-lucide="image" class="w-4 h-4"></i>
          <span>相片</span>
          <input id="file-input" type="file" accept="image/*" class="hidden">
        </label>
      </div>

      <!-- 定格後的按鈕區 -->
      <div id="frozen-controls" class="hidden absolute bottom-3 inset-x-0 flex justify-center items-center space-x-2 px-3 z-20">
        <button id="retake-btn" class="px-3.5 py-2 rounded-xl bg-slate-800/90 text-slate-300 border border-slate-700 text-xs font-semibold flex items-center space-x-1">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
          <span>重新拍照</span>
        </button>
        <button id="export-btn" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow-lg shadow-emerald-600/30 flex items-center space-x-1.5 active:scale-95 transition-all">
          <i data-lucide="share-2" class="w-3.5 h-3.5"></i>
          <span>生成確認圖 (傳賣家)</span>
        </button>
      </div>

      <!-- 啟動遮罩 (相機權限與啟動) -->
      <div id="start-overlay" class="absolute inset-0 bg-slate-950/95 flex flex-col items-center justify-center p-6 text-center space-y-4 z-30">
        <div class="w-16 h-16 rounded-full bg-blue-500/20 flex items-center justify-center text-blue-400 border border-blue-500/40">
          <i data-lucide="shield-check" class="w-8 h-8"></i>
        </div>
        <div>
          <h3 class="text-base font-bold text-white">啟動精準量測系統</h3>
          <p class="text-xs text-slate-400 mt-1">請將健保卡與腳掌平放地面・點選下方開啟</p>
        </div>
        <button id="start-cam-btn" class="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-xl text-xs font-bold text-white shadow-lg active:scale-95 transition-all">
          開啟相機
        </button>
      </div>
    </div>

    <!-- 步驟選擇面板 (定格後顯示) -->
    <div id="adjust-panel" class="hidden w-full bg-slate-900 border border-slate-800 rounded-2xl p-3 shadow-xl space-y-2.5">
      <div class="flex items-center justify-between text-xs">
        <span class="font-bold text-white">步驟一：選擇要微調的標尺</span>
      </div>
      <div class="grid grid-cols-3 gap-1.5 text-[11px]" id="target-selector">
        <button class="target-btn active p-2 rounded-lg border border-blue-500 bg-blue-500/20 text-blue-400 font-bold text-center" data-target="card">
          1. 💳 卡片兩端
        </button>
        <button class="target-btn p-2 rounded-lg border border-slate-800 bg-slate-950 text-slate-300 font-medium text-center" data-target="len">
          2. 趾尖與腳跟
        </button>
        <button class="target-btn p-2 rounded-lg border border-slate-800 bg-slate-950 text-slate-300 font-medium text-center" data-target="width">
          3. 腳掌最寬處
        </button>
      </div>

      <!-- D-Pad 像素微調按鈕群 -->
      <div class="bg-slate-950/70 border border-slate-800 p-2 rounded-xl flex items-center justify-between">
        <span class="text-[11px] text-slate-400 font-medium flex items-center space-x-1">
          <i data-lucide="crosshair" class="w-3.5 h-3.5 text-blue-400"></i>
          <span>像素方向微調：</span>
        </span>
        <div class="grid grid-cols-4 gap-1">
          <button id="dpad-up" class="w-8 h-8 bg-slate-800 hover:bg-slate-700 active:bg-blue-600 rounded-lg flex items-center justify-center text-white text-xs font-bold shadow">↑</button>
          <button id="dpad-down" class="w-8 h-8 bg-slate-800 hover:bg-slate-700 active:bg-blue-600 rounded-lg flex items-center justify-center text-white text-xs font-bold shadow">↓</button>
          <button id="dpad-left" class="w-8 h-8 bg-slate-800 hover:bg-slate-700 active:bg-blue-600 rounded-lg flex items-center justify-center text-white text-xs font-bold shadow">←</button>
          <button id="dpad-right" class="w-8 h-8 bg-slate-800 hover:bg-slate-700 active:bg-blue-600 rounded-lg flex items-center justify-center text-white text-xs font-bold shadow">→</button>
        </div>
      </div>
    </div>

    <!-- 數據與推薦盒 -->
    <div class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3">
      <div class="grid grid-cols-2 gap-2 text-center">
        <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
          <div id="lbl-1" class="text-[10px] text-slate-400">實測裸足長度</div>
          <div id="val-1" class="text-base font-bold text-blue-400 font-mono mt-0.5">-- cm</div>
        </div>
        <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
          <div id="lbl-2" class="text-[10px] text-slate-400">實測足掌寬度</div>
          <div id="val-2" class="text-base font-bold text-emerald-400 font-mono mt-0.5">-- cm</div>
        </div>
      </div>

      <!-- 防退貨建議尺碼盒 -->
      <div class="bg-gradient-to-r from-blue-950/
