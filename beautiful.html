<!DOCTYPE html>

    .ad-fixed-bottom {

</head>
<body>

  <!-- 最上層：即時天氣與日期時間大看板 -->
  <div class="dashboard-card">
    <div class="weather-row">
      <div class="weather-info">
        <span id="weather-icon">⛅</span>
        <span id="weather-desc">載入天氣中...</span>
      </div>
      <div class="weather-temp" id="weather-temp">--°C</div>
    </div>
    <div class="datetime-row">
      <div class="date-text" id="current-date">--月--日 星期-</div>
      <div class="time-text" id="current-time">00:00:00</div>
    </div>
  </div>

  <header>
    <h1>美茉莉備忘錄</h1>
  </header>

  <!-- 語言選擇（移除說明標籤，大字體觸控鈕） -->
  <div class="lang-bar">
    <button class="lang-btn active" id="lang-btn-mandarin" onclick="setLanguage('mandarin')">國語</button>
    <button class="lang-btn" id="lang-btn-taiwanese" onclick="setLanguage('taiwanese')">台語</button>
    <button class="lang-btn" id="lang-btn-hakka" onclick="setLanguage('hakka')">客家語</button>
  </div>

  <div class="app-card">
    <div class="section-label">1. 選擇要記的事情：</div>
    
    <!-- 2個一排的網格排列 -->
    <div class="category-grid-2col">
      <!-- 第一排：吃藥 與 回診 -->
      <button class="cat-btn active" onclick="selectCat('吃藥', '💊', this)">
        <span class="icon">💊</span>吃藥
      </button>
      <button class="cat-btn" onclick="selectCat('回診', '🏥', this)">
        <span class="icon">🏥</span>回診
      </button>

      <!-- 第二排：運動健身 與 一般日常 -->
      <button class="cat-btn" onclick="selectCat('運動健身', '🏃', this)">
        <span class="icon">🏃</span>運動健身
      </button>
      <button class="cat-btn" onclick="selectCat('一般日常', '📝', this)">
        <span class="icon">📝</span>一般日常
      </button>

      <!-- 第三排：居家無障礙空間與輔具諮詢 與 老當益壯中高齡就業 -->
      <!-- 可將 tel:1966 替換成您朋友的諮詢專線，例如 tel:0912345678 -->
      <a href="tel:1966" class="cat-btn link-btn">
        <span class="icon">🛠️</span>
        <span style="font-size: 21px;">居家無障礙空間與輔具諮詢</span>
      </a>
      <!-- 連結勞動部中高齡就業專區 -->
      <a href="https://45plus.wda.gov.tw/" target="_blank" rel="noopener noreferrer" class="cat-btn link-btn">
        <span class="icon">💼</span>
        <span style="font-size: 21px;">老當益壯 (中高齡就業)</span>
      </a>
    </div>

    <div class="section-label">2. 說話或打字輸入：</div>
    <div class="input-row">
      <input type="text" id="note-input" class="text-input" placeholder="例如：晚上吃降血壓藥">
      <button class="mic-btn-large" id="mic-btn" onclick="toggleRecord()" title="按一下用講的">🎙️</button>
    </div>

    <div class="time-row">
      <span class="time-label">⏰ 提醒時間：</span>
      <input type="time" id="alarm-time" class="time-picker">
    </div>

    <button class="add-btn" onclick="addNote()">＋ 記下來並設定提醒</button>
  </div>

  <div class="list-container">
    <div class="list-header">
      📋 記下的行程清單
    </div>
    <div id="notes-list"></div>
  </div>

  <!-- 底部固定合規廣告欄位 -->
  <div class="ad-fixed-bottom">
    [ 贊助廣告版位 · 零個資留存安全認證 ]
  </div>

  <script>
    const STORAGE_KEY = 'senior_care_notes_v4';
    let currentCategory = '吃藥';
    let currentLang = 'mandarin'; // 'mandarin', 'taiwanese', 'hakka'
    let isRecording = false;
    let recognition = null;
    let notifiedIds = new Set();
    let femaleVoice = null;

    // 1. 溫柔女性語音尋找與配置
    function loadVoices() {
      if ('speechSynthesis' in window) {
        const voices = window.speechSynthesis.getVoices();
        // 優先尋找中文女性常用語音（微軟、蘋果、Google 等）
        femaleVoice = voices.find(v => 
          (v.lang.includes('zh') || v.lang.includes('cmn')) && 
          (v.name.includes('HsiaoChen') || v.name.includes('Mei-Jia') || v.name.includes('Yating') || 
           v.name.includes('Female') || v.name.includes('Google 國語') || v.name.includes('Tingting') || v.name.includes('Hanhan'))
        ) || voices.find(v => v.lang.includes('zh'));
      }
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    // 2. 語言切換
    function setLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`lang-btn-${lang}`).classList.add('active');

      if (lang === 'mandarin') {
        speakGentle("已切換為國語播報");
      } else if (lang === 'taiwanese') {
        speakGentle("已換作台語播報，請講台語");
      } else if (lang === 'hakka') {
        speakGentle("已切換做客家話播報，請講客話");
      }
    }

    // 溫柔女聲朗讀函式
    function speakGentle(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        if (femaleVoice) utter.voice = femaleVoice;
        utter.lang = 'zh-TW';
        utter.rate = 0.85; // 放緩語速，親切易懂
        utter.pitch = 1.15; // 稍微提高音調呈現溫柔女聲音質
        window.speechSynthesis.speak(utter);
      }
    }

    // 3. 即時時鐘與鬧鐘定時器
    function updateClock() {
      const now = new Date();
      const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const m = now.getMonth() + 1;
      const d = now.getDate();
      const day = weekdays[now.getDay()];

      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');

      document.getElementById('current-date').innerText = `${m}月${d}日 ${day}`;
      document.getElementById('current-time').innerText = `${hh}:${mm}:${ss}`;

      // 檢查鬧鐘
      const currentHHMM = `${hh}:${mm}`;
      const notes = getNotes();
      notes.forEach(note => {
        if (note.time === currentHHMM) {
          const alarmKey = `${note.id}-${currentHHMM}`;
          if (!notifiedIds.has(alarmKey)) {
            notifiedIds.add(alarmKey);
            triggerAlarm(note);
          }
        }
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function triggerAlarm(note) {
      let promptText = "";
      if (currentLang === 'taiwanese') {
        promptText = `時間到囉！貼心提醒您，${note.category}：${note.text}`;
      } else if (currentLang === 'hakka') {
        promptText = `時間到哩！細心提醒您，${note.category}：${note.text}`;
      } else {
        promptText = `時間到了！美茉莉貼心提醒您，${note.category}：${note.text}`;
      }

      speakGentle(promptText);
      setTimeout(() => speakGentle(promptText), 4500);
      alert(`【美茉莉備忘提醒】\n\n類別：${note.category}\n內容：${note.text}`);
    }

    // 4. 天氣抓取（Open-Meteo 免費氣象 API）
    function fetchWeather(lat = 25.04, lon = 121.28) {
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
        .then(res => res.json())
        .then(data => {
          if (data && data.current_weather) {
            const temp = Math.round(data.current_weather.temperature);
            const code = data.current_weather.weathercode;
            const weatherDesc = getWeatherText(code);
            document.getElementById('weather-temp').innerText = `${temp}°C`;
            document.getElementById('weather-desc').innerText = weatherDesc.text;
            document.getElementById('weather-icon').innerText = weatherDesc.icon;
          }
        })
        .catch(() => {
          document.getElementById('weather-desc').innerText = '多雲晴';
          document.getElementById('weather-temp').innerText = '舒適';
        });
    }

    function getWeatherText(code) {
      if (code === 0) return { text: '晴朗', icon: '☀️' };
      if ([1, 2, 3].includes(code)) return { text: '多雲晴', icon: '⛅' };
      if ([45, 48].includes(code)) return { text: '起霧', icon: '🌫️' };
      if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return { text: '陰有雨', icon: '🌧️' };
      if ([95, 96, 99].includes(code)) return { text: '雷陣雨', icon: '⛈️' };
      return { text: '陰天', icon: '☁️' };
    }

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => fetchWeather(pos.coords.latitude, pos.coords.longitude),
        () => fetchWeather()
      );
    } else {
      fetchWeather();
    }

    // 5. 分類切換
    function selectCat(cat, icon, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => {
        if (!b.classList.contains('link-btn')) b.classList.remove('active');
      });
      btn.classList.add('active');

      const input = document.getElementById('note-input');
      if (cat === '吃藥') input.placeholder = '例如：晚上吃降血壓藥半顆';
      else if (cat === '回診') input.placeholder = '例如：下午三點醫院心臟科';
      else if (cat === '運動健身') input.placeholder = '例如：公園散步半小時、甩手';
      else if (cat === '一般日常') input.placeholder = '例如：買牛奶、去郵局領掛號';
    }

    // 6. 語音辨識
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'zh-TW';

      recognition.onstart = () => {
        isRecording = true;
        const mic = document.getElementById('mic-btn');
        mic.classList.add('recording');
        mic.innerText = '🔴';
      };

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript.trim();
        document.getElementById('note-input').value = text;
      };

      recognition.onend = () => {
        isRecording = false;
        const mic = document.getElementById('mic-btn');
        mic.classList.remove('recording');
        mic.innerText = '🎙️';
      };

      recognition.onerror = () => {
        isRecording = false;
        document.getElementById('mic-btn').classList.remove('recording');
        document.getElementById('mic-btn').innerText = '🎙️';
        speakGentle("抱歉沒有聽清楚，請您再按一次說話。");
      };
    }

    function toggleRecord() {
      if (!recognition) {
        alert("此手機瀏覽器不支援語音辨識，請直接在文字框打字。");
        return;
      }
      if (isRecording) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    // 7. 新增備忘
    function addNote() {
      const input = document.getElementById('note-input');
      const timeInput = document.getElementById('alarm-time');
      const text = input.value.trim();

      if (!text) {
        speakGentle("請先說話或輸入內容喔！");
        return;
      }

      const notes = getNotes();
      const newNote = {
        id: Date.now(),
        category: currentCategory,
        text: text,
        time: timeInput.value || '',
        createdDate: new Date().toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric' })
      };

      notes.unshift(newNote);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));

      input.value = '';
      timeInput.value = '';
      render();

      let confirmMsg = `已幫您記下${newNote.category}：${newNote.text}`;
      if (newNote.time) confirmMsg += `，會在 ${newNote.time} 提醒您`;
      speakGentle(confirmMsg);
    }

    function getNotes() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    }

    function deleteNote(id) {
      const notes = getNotes().filter(n => n.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
      render();
    }

    function render() {
      const listEl = document.getElementById('notes-list');
      const notes = getNotes();

      if (notes.length === 0) {
        listEl.innerHTML = '<div style="color:#78909C; text-align:center; margin-top:24px; font-size:22px; font-weight:bold;">目前沒有任何備忘事項</div>';
        return;
      }

      listEl.innerHTML = notes.map(n => `
        <div class="note-card">
          <div style="flex:1;">
            <span class="cat-tag tag-${n.category}">${n.category}</span>
            <div class="note-text">${n.text}</div>
            <div class="note-alarm">${n.time ? '⏰ 提醒：' + n.time : '📅 記於：' + n.createdDate}</div>
          </div>
          <div class="card-actions">
            <button class="btn-action-speak" onclick="speakGentle('${n.category}提醒：${n.text}')">🔊 念出來</button>
            <button class="btn-action-del" onclick="deleteNote(${n.id})">刪除</button>
          </div>
        </div>
      `).join('');
    }

    render();
  </script>
</body>
</html>
