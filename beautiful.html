<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>幾何外觀比例分析</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #121212; color: #fff; }
    .container { position: relative; width: 640px; height: 480px; }
    video, canvas { position: absolute; left: 0; top: 0; width: 640px; height: 480px; border-radius: 8px; }
    #status-box { margin-top: 10px; padding: 12px; border-radius: 6px; background: #222; width: 616px; font-size: 14px; }
    .warning { color: #ffb74d; }
  </style>
</head>
<body>
  <h2>外觀幾何對稱與比例參考工具</h2>
  <div class="container">
    <video id="webcam" playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>
  <div id="status-box">
    <div>狀態：<span id="guide-text">正在載入模型...</span></div>
    <div>對稱性指數：<span id="symmetry-score">--</span></div>
    <p class="warning">免責聲明：本工具僅供視覺造型參考，運算完全於本機進行，非醫療診斷依據。</p>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output_canvas');
    const ctx = canvas.getContext('2d');
    const guideText = document.getElementById('guide-text');
    const symmetryScore = document.getElementById('symmetry-score');

    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true, // 啟用 478 點 (含虹膜)
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.7
    });

    faceMesh.onResults((results) => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
        guideText.innerText = "未檢測到臉部，請正對鏡頭";
        symmetryScore.innerText = "--";
        return;
      }

      const landmarks = results.multiFaceLandmarks[0];

      // 關鍵點索引：1=鼻尖, 468=左虹膜中心, 473=右虹膜中心, 234=左臉頰, 454=右臉頰
      const nose = landmarks[1];
      const leftIris = landmarks[468];
      const rightIris = landmarks[473];

      // 防呆：檢測視角偏轉 (Yaw 簡化判斷：鼻尖與兩側虹膜中點水平偏離)
      const midEyeX = (leftIris.x + rightIris.x) / 2;
      const yawOffset = Math.abs(nose.x - midEyeX);

      if (yawOffset > 0.03) {
        guideText.innerText = "角度偏差過大，請將臉部擺正";
        return;
      }

      guideText.innerText = "姿態標準，正在測量";

      // 計算左右臉寬對稱比 (鼻尖至左右側外耳下顎緣)
      const leftDist = Math.hypot(landmarks[234].x - nose.x, landmarks[234].y - nose.y);
      const rightDist = Math.hypot(landmarks[454].x - nose.x, landmarks[454].y - nose.y);
      const ratio = (Math.min(leftDist, rightDist) / Math.max(leftDist, rightDist)) * 100;
      symmetryScore.innerText = `${ratio.toFixed(1)}%`;

      // 繪製幾何線條圖卡效果 (非病態特徵標註)
      ctx.strokeStyle = '#00e5ff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(leftIris.x * canvas.width, leftIris.y * canvas.height);
      ctx.lineTo(rightIris.x * canvas.width, rightIris.y * canvas.height);
      ctx.stroke();
    });

    const camera = new Camera(video, {
      onFrame: async () => { await faceMesh.send({ image: video }); },
      width: 640,
      height: 480
    });
    camera.start();
  </script>
</body>
</html>
