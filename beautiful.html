<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AuraMeasure - 智能手足尺碼精準量測工具</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    .mode-tab.active {
      background-color: #3b82f6;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-2 sm:p-4 font-sans selection:bg-blue-500">

  <!-- 頂部標頭 -->
  <header class="w-full max-w-md flex items-center justify-between pb-2 border-b border-slate-800">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/20 text-sm">
        M
      </div>
      <div>
        <h1 class="text-sm font-bold text-white tracking-wide">AuraMeasure 尺寸量測</h1>
        <p class="text-[9px] text-slate-400">標準卡片校正・手部手套 & 足部買鞋尺碼</p>
      </div>
    </div>
    <span class="px-2 py-0.5 rounded-full bg-slate-900 border border-slate-800 text-[10px] text-blue-400 font-mono">
      高精度校正模式
    </span>
  </header>

  <main class="w-full max-w-md mt-2 flex flex-col items-center space-y-3">

    <!-- 模式切換：手部 vs 腳部 -->
    <div class="w-full grid grid-cols-2 gap-1.5 bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs font-semibold">
      <button id="tab-foot" class="mode-tab active py-2 rounded-lg transition-all flex items-center justify-center space-x-1.5">
        <i data-lucide="footprints" class="w-4 h-4"></i>
        <span>量腳（買鞋推薦）</span>
      </button>
      <button id="tab-hand" class="mode-tab py-2 rounded-lg text-slate-400 transition-all flex items-center justify-center space-x-1.5">
        <i data-lucide="hand" class="w-4 h-4"></i>
        <span>量手（手套推薦）</span>
      </button>
    </div>

    <!-- 拍照與量測畫布視窗 -->
    <div class="relative w-full aspect-[3/4] rounded-2xl overflow-hidden bg-slate-900 border border-slate-800 shadow-2xl flex items-center justify-center">
      <video id="webcam" class="absolute inset-0 w-full h-full object-cover" playsinline autoplay muted></video>
      <canvas id="measure-canvas" class="absolute inset-0 w-full h-full object-cover z-10 touch-none"></canvas>

      <!-- 操作導引橫幅 -->
      <div id="guide-banner" class="absolute top-3 inset-x-3 bg-slate-950/85 backdrop-blur-md border border-slate-700/80 p-2.5 rounded-xl z-20 shadow-lg text-[11px] leading-relaxed text-slate-300">
        <span class="text-blue-400 font-bold">💡 拍攝建議：</span>請將健保卡/悠遊卡平放在地，腳（或手）平貼卡片旁拍下完整俯視照。
      </div>

      <!-- 拍攝控制按鈕 -->
      <div id="cam-controls" class="absolute bottom-4 inset-x-0 flex justify-center items-center space-x-3 px-4 z-20">
        <button id="snap-btn" class="px-6 py-2.5 rounded-full bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs shadow-lg shadow-blue-500/30 flex items-center space-x-1.5 active:scale-95 transition-all">
          <i data-lucide="camera" class="w-4 h-4"></i>
          <span>定格拍照量測</span>
        </button>
        <label class="px-4 py-2.5 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs border border-slate-700 cursor-pointer flex items-center space-x-1.5">
          <i data-lucide="image" class="w-4 h-4"></i>
          <span>上傳相片</span>
          <input id="file-input" type="file" accept="image/*" class="hidden">
        </label>
      </div>

      <!-- 定格後的重測與微調按鈕 -->
      <div id="frozen-controls" class="hidden absolute bottom-4 inset-x-0 flex justify-center items-center space-x-3 px-4 z-20">
        <button id="retake-btn" class="px-5 py-2 rounded-full bg-slate-800/90 text-slate-300 border border-slate-700 text-xs font-semibold flex items-center space-x-1.5">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
          <span>重新拍照</span>
        </button>
      </div>

      <!-- 初始啟動相機遮罩 -->
      <div id="start-overlay" class="absolute inset-0 bg-slate-950/95 flex flex-col items-center justify-center p-6 text-center space-y-4 z-30">
        <div class="w-16 h-16 rounded-full bg-blue-500/20 flex items-center justify-center text-blue-400 border border-blue-500/40">
          <i data-lucide="ruler" class="w-8 h-8"></i>
        </div>
        <div>
          <h3 class="text-base font-bold text-white">啟動手足尺碼精確量測</h3>
          <p class="text-xs text-slate-400 mt-1">使用標準卡片光學比對，誤差小於 0.2 公分</p>
        </div>
        <button id="start-cam-btn" class="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-xl text-xs font-bold text-white shadow-lg shadow-blue-500/30 active:scale-95 transition-all">
          開啟相機
        </button>
      </div>
    </div>

    <!-- 量測尺標微調控制台 -->
    <div id="adjust-panel" class="hidden w-full bg-slate-900 border border-slate-800 rounded-2xl p-3.5 shadow-xl space-y-3">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <span class="text-xs font-bold text-white flex items-center space-x-1">
          <i data-lucide="sliders" class="w-3.5 h-3.5 text-blue-400"></i>
          <span>點選調整量測錨點</span>
        </span>
        <span class="text-[10px] text-slate-400">可在圖片上直接拖拉圓點</span>
      </div>

      <!-- 選擇目前拖曳的標尺 -->
      <div class="grid grid-cols-4 gap-1 text-[11px]" id="target-selector">
        <button class="target-btn active p-1.5 rounded-lg border border-blue-500 bg-blue-500/20 text-blue-400 font-medium text-center" data-target="card">
          💳 校正卡片
        </button>
        <button id="target-btn-1" class="target-btn p-1.5 rounded-lg border border-slate-800 bg-slate-950/50 text-slate-300 font-medium text-center" data-target="len">
          腳長 (長度)
        </button>
        <button id="target-btn-2" class="target-btn p-1.5 rounded-lg border border-slate-800 bg-slate-950/50 text-slate-300 font-medium text-center" data-target="width">
          腳掌 (寬度)
        </button>
        <button id="target-btn-3" class="target-btn p-1.5 rounded-lg border border-slate-800 bg-slate-950/50 text-slate-300 font-medium text-center" data-target="part3">
          腳跟寬
        </button>
      </div>
    </div>

    <!-- 測量數據結果卡片 -->
    <div class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <h2 id="result-title" class="text-xs font-bold text-white">足部尺寸量測數據 (Shoe Size)</h2>
        <span class="text-[10px] text-emerald-400 font-mono">標準卡長 8.56 cm 換算</span>
      </div>

      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800/80">
          <div id="lbl-1" class="text-[10px] text-slate-400">總腳長</div>
          <div id="val-1" class="text-base font-bold text-blue-400 font-mono mt-0.5">-- cm</div>
        </div>
        <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800/80">
          <div id="lbl-2" class="text-[10px] text-slate-400">腳掌寬</div>
          <div id="val-2" class="text-base font-bold text-emerald-400 font-mono mt-0.5">-- cm</div>
        </div>
        <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800/80">
          <div id="lbl-3" class="text-[10px] text-slate-400">腳跟寬</div>
          <div id="val-3" class="text-base font-bold text-purple-400 font-mono mt-0.5">-- cm</div>
        </div>
      </div>

      <!-- 尺碼選購推薦 -->
      <div class="bg-slate-950/60 p-3 rounded-xl border border-slate-800 text-xs space-y-1.5">
        <div class="text-[11px] font-bold text-slate-300 flex items-center space-x-1">
          <i data-lucide="tag" class="w-3.5 h-3.5 text-blue-400"></i>
          <span>購買推薦尺碼：</span>
        </div>
        <div id="recommendation-text" class="text-slate-400 text-[11px] leading-relaxed">
          請先拍照或上傳相片，以信用卡對齊校正後顯示精確鞋碼 / 手套尺碼。
        </div>
      </div>
    </div>

  </main>

  <footer class="w-full max-w-md mt-2 text-center text-[9px] text-slate-500">
    純本地離線像素幾何運算・相片絕不上傳雲端
  </footer>

  <script>
    lucide.createIcons();

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('measure-canvas');
    const ctx = canvas.getContext('2d');

    const tabFoot = document.getElementById('tab-foot');
    const tabHand = document.getElementById('tab-hand');
    const startOverlay = document.getElementById('start-overlay');
    const startCamBtn = document.getElementById('start-cam-btn');
    const snapBtn = document.getElementById('snap-btn');
    const retakeBtn = document.getElementById('retake-btn');
    const fileInput = document.getElementById('file-input');
    const camControls = document.getElementById('cam-controls');
    const frozenControls = document.getElementById('frozen-controls');
    const adjustPanel = document.getElementById('adjust-panel');

    const resultTitle = document.getElementById('result-title');
    const targetBtn1 = document.getElementById('target-btn-1');
    const targetBtn2 = document.getElementById('target-btn-2');
    const targetBtn3 = document.getElementById('target-btn-3');
    const lbl1 = document.getElementById('lbl-1');
    const lbl2 = document.getElementById('lbl-2');
    const lbl3 = document.getElementById('lbl-3');
    const val1 = document.getElementById('val-1');
    const val2 = document.getElementById('val-2');
    const val3 = document.getElementById('val-3');
    const recommendationText = document.getElementById('recommendation-text');

    let currentMode = 'foot'; // 'foot' | 'hand'
    let isFrozen = false;
    let frozenImage = null;
    let activeTarget = 'card';
    let draggedPoint = null;

    // ISO 卡片標準長度 (公分)
    const CARD_REAL_CM = 8.56;

    // 錨點配置 (預設在畫布上的相對比例坐標 [0~1])
    let markers = {
      card: { p1: { x: 0.15, y: 0.25 }, p2: { x: 0.38, y: 0.25 }, color: '#38bdf8', label: '校正卡長 (8.56cm)' },
      len:  { p1: { x: 0.65, y: 0.18 }, p2: { x: 0.65, y: 0.82 }, color: '#60a5fa', label: '長度' },
      width:{ p1: { x: 0.50, y: 0.42 }, p2: { x: 0.82, y: 0.42 }, color: '#34d399', label: '寬度' },
      part3:{ p1: { x: 0.55, y: 0.78 }, p2: { x: 0.75, y: 0.78 }, color: '#c084fc', label: '後跟/手指' }
    };

    // 啟動鏡頭
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 960 } },
          audio: false
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          video.play();
          startOverlay.classList.add('hidden');
          resizeCanvas();
          renderLoop();
        };
      } catch (err) {
        console.warn("無法啟動後鏡頭，切換前鏡頭重試:", err);
        try {
          const streamUser = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          video.srcObject = streamUser;
          video.play();
          startOverlay.classList.add('hidden');
          resizeCanvas();
          renderLoop();
        } catch (e) {
          alert("無法存取相機，請使用下方「上傳相片」功能量測！");
          startOverlay.classList.add('hidden');
        }
      }
    }

    startCamBtn.onclick = initCamera;

    function resizeCanvas() {
      canvas.width = canvas.clientWidth || 360;
      canvas.height = canvas.clientHeight || 480;
    }

    window.onresize = resizeCanvas;

    // 即時畫面循環
    function renderLoop() {
      if (!isFrozen && video.readyState >= 2) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        drawMarkers();
      }
      requestAnimationFrame(renderLoop);
    }

    // 拍下定格
    snapBtn.onclick = () => {
      isFrozen = true;
      const off = document.createElement('canvas');
      off.width = canvas.width;
      off.height = canvas.height;
      off.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      frozenImage = off;
      enterFrozenMode();
    };

    // 上傳相片量測
    fileInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          isFrozen = true;
          resizeCanvas();
          const off = document.createElement('canvas');
          off.width = canvas.width;
          off.height = canvas.height;
          off.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          frozenImage = off;
          enterFrozenMode();
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    };

    function enterFrozenMode() {
      camControls.classList.add('hidden');
      frozenControls.classList.remove('hidden');
      adjustPanel.classList.remove('hidden');
      redrawFrozen();
      calculateMeasurements();
    }

    retakeBtn.onclick = () => {
      isFrozen = false;
      frozenImage = null;
      camControls.classList.remove('hidden');
      frozenControls.classList.add('hidden');
      adjustPanel.classList.add('hidden');
    };

    // 繪製標尺錨點
    function drawMarkers() {
      const w = canvas.width;
      const h = canvas.height;

      Object.keys(markers).forEach(key => {
        const m = markers[key];
        const x1 = m.p1.x * w;
        const y1 = m.p1.y * h;
        const x2 = m.p2.x * w;
        const y2 = m.p2.y * h;

        ctx.save();
        ctx.strokeStyle = m.color;
        ctx.lineWidth = (activeTarget === key) ? 3 : 1.8;
        ctx.setLineDash((activeTarget === key) ? [] : [4, 4]);

        // 連接線
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();

        // 兩端控制點圓圈
        drawControlPoint(x1, y1, m.color, activeTarget === key);
        drawControlPoint(x2, y2, m.color, activeTarget === key);

        // 標籤文字
        ctx.fillStyle = m.color;
        ctx.font = 'bold 11px monospace';
        ctx.fillText(m.label, (x1 + x2) / 2 - 20, (y1 + y2) / 2 - 8);

        ctx.restore();
      });
    }

    function drawControlPoint(x, y, color, isActive) {
      ctx.beginPath();
      ctx.arc(x, y, isActive ? 9 : 6, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function redrawFrozen() {
      if (!frozenImage) return;
      ctx.drawImage(frozenImage, 0, 0, canvas.width, canvas.height);
      drawMarkers();
    }

    // 核心光學長度換算演算法
    function calculateMeasurements() {
      const w = canvas.width;
      const h = canvas.height;

      // 1. 計算校正卡在畫布上的像素距離
      const cardDx = (markers.card.p2.x - markers.card.p1.x) * w;
      const cardDy = (markers.card.p2.y - markers.card.p1.y) * h;
      const cardPx = Math.hypot(cardDx, cardDy);

      if (cardPx < 10) return;

      // 核心比率：1 像素代表多少公分
      const cmPerPx = CARD_REAL_CM / cardPx;

      // 計算各部位長度 (cm)
      const getLenCm = (m) => {
        const dx = (m.p2.x - m.p1.x) * w;
        const dy = (m.p2.y - m.p1.y) * h;
        return (Math.hypot(dx, dy) * cmPerPx).toFixed(1);
      };

      const len1 = getLenCm(markers.len);
      const len2 = getLenCm(markers.width);
      const len3 = getLenCm(markers.part3);

      val1.innerText = `${len1} cm`;
      val2.innerText = `${len2} cm`;
      val3.innerText = `${len3} cm`;

      updateRecommendations(parseFloat(len1), parseFloat(len2));
    }

    // 買鞋 / 買手套 專業尺碼推薦矩陣
    function updateRecommendations(len, width) {
      if (currentMode === 'foot') {
        // 腳長換算鞋碼 (公式基準：日碼 JPN cm，歐碼 EU = (腳長+1.5)*1.5，美碼 US 男)
        const jpn = (len + 0.5).toFixed(1);
        const eu = Math.round((len + 1.5) * 1.5);
        const us = ((len - 18) * 0.95).toFixed(1);

        // 楦頭寬度判定 (以常見長寬比判定寬楦)
        const widthRatio = width / len;
        let widthType = "標準楦 (D)";
        if (widthRatio > 0.40) widthType = "寬楦 (2E / 3E)";
        if (widthRatio > 0.43) widthType = "特寬楦 (4E)";

        recommendationText.innerHTML = `
          推薦鞋碼：<strong>EU ${eu}</strong> / <strong>US ${us}</strong> / <strong>${jpn} cm</strong><br>
          腳掌楦頭分析：<strong>${widthType}</strong> (建議購買時留意楦頭版型避開壓迫)
        `;
      } else {
        // 手套尺碼判定 (以手掌寬度與全手長判定國際標準手套 S / M / L / XL)
        let gloveSize = "M 號 (標準通用)";
        if (width < 7.5) gloveSize = "S 號 (偏窄小手)";
        else if (width >= 8.5 && width < 9.5) gloveSize = "L 號 (大手掌)";
        else if (width >= 9.5) gloveSize = "XL 號 (特大尺寸)";

        recommendationText.innerHTML = `
          推薦手套尺碼：<strong>${gloveSize}</strong><br>
          指套吻合參考：中指長約 <strong>${val3.innerText}</strong>，選購時可對照商品指長避開空端。
        `;
      }
    }

    // 觸控與滑鼠拖曳控制點
    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) / canvas.width,
        y: (clientY - rect.top) / canvas.height
      };
    }

    function onPointerDown(e) {
      const pos = getPointerPos(e);
      const threshold = 0.08; // 點擊感應半徑

      // 優先尋找目前啟動標尺的控制點
      const m = markers[activeTarget];
      if (Math.hypot(pos.x - m.p1.x, pos.y - m.p1.y) < threshold) {
        draggedPoint = m.p1;
      } else if (Math.hypot(pos.x - m.p2.x, pos.y - m.p2.y) < threshold) {
        draggedPoint = m.p2;
      }
    }

    function onPointerMove(e) {
      if (!draggedPoint) return;
      const pos = getPointerPos(e);
      draggedPoint.x = Math.max(0.02, Math.min(0.98, pos.x));
      draggedPoint.y = Math.max(0.02, Math.min(0.98, pos.y));
      if (isFrozen) {
        redrawFrozen();
        calculateMeasurements();
      }
    }

    function onPointerUp() {
      draggedPoint = null;
    }

    canvas.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    canvas.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp, { passive: true });

    // 模式切換邏輯 (手 / 腳)
    tabFoot.onclick = () => {
      currentMode = 'foot';
      tabFoot.classList.add('active');
      tabFoot.classList.remove('text-slate-400');
      tabHand.classList.remove('active');
      tabHand.classList.add('text-slate-400');

      resultTitle.innerText = "足部尺寸量測數據 (Shoe Size)";
      targetBtn1.innerText = "腳長 (長度)";
      targetBtn2.innerText = "腳掌 (寬度)";
      targetBtn3.innerText = "腳跟寬";
      lbl1.innerText = "總腳長";
      lbl2.innerText = "腳掌寬";
      lbl3.innerText = "腳跟寬";

      markers.len.label = "總腳長";
      markers.width.label = "腳掌寬";
      markers.part3.label = "腳跟寬";

      if (isFrozen) {
        redrawFrozen();
        calculateMeasurements();
      }
    };

    tabHand.onclick = () => {
      currentMode = 'hand';
      tabHand.classList.add('active');
      tabHand.classList.remove('text-slate-400');
      tabFoot.classList.remove('active');
      tabFoot.classList.add('text-slate-400');

      resultTitle.innerText = "手部尺寸量測數據 (Glove Size)";
      targetBtn1.innerText = "手長 (手腕到中指)";
      targetBtn2.innerText = "手掌寬度";
      targetBtn3.innerText = "中指長度";
      lbl1.innerText = "全手長";
      lbl2.innerText = "掌寬";
      lbl3.innerText = "中指長";

      markers.len.label = "全手長";
      markers.width.label = "掌寬";
      markers.part3.label = "中指長";

      if (isFrozen) {
        redrawFrozen();
        calculateMeasurements();
      }
    };

    // 目標標尺切換
    document.querySelectorAll('.target-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.target-btn').forEach(b => {
          b.classList.remove('active', 'border-blue-500', 'bg-blue-500/20', 'text-blue-400');
          b.classList.add('border-slate-800', 'bg-slate-950/50', 'text-slate-300');
        });
        btn.classList.add('active', 'border-blue-500', 'bg-blue-500/20', 'text-blue-400');
        btn.classList.remove('border-slate-800', 'bg-slate-950/50', 'text-slate-300');
        activeTarget = btn.dataset.target;
        if (isFrozen) redrawFrozen();
      };
    });
  </script>
</body>
</html>
