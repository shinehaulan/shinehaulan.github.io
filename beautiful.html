<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AuraMetric - 唇部幾何美學與比例分析</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    @keyframes scan-glow {
      0% { top: 0%; opacity: 0.9; }
      50% { opacity: 0.2; }
      100% { top: 100%; opacity: 0.9; }
    }
    .scanner-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ec4899, transparent);
      box-shadow: 0 0 12px #ec4899;
      animation: scan-glow 2s ease-in-out infinite;
    }
    .guide-box {
      border: 2px dashed rgba(236, 72, 153, 0.4);
      transition: all 0.3s ease;
    }
    .guide-box.ready {
      border: 2px solid #10b981;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.25) inset;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-3 sm:p-6 selection:bg-pink-500 selection:text-black">

  <!-- Header -->
  <header class="w-full max-w-4xl flex items-center justify-between pb-4 border-b border-slate-800">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-pink-500 to-rose-600 flex items-center justify-center font-bold text-white shadow-lg shadow-pink-500/20">
        L
      </div>
      <div>
        <h1 class="text-base sm:text-lg font-bold tracking-wide">AuraMetric LipPro</h1>
        <p class="text-[10px] text-slate-400">唇形幾何比例與飽滿度客觀分析</p>
      </div>
    </div>
    
    <div class="flex bg-slate-900 border border-slate-800 p-1 rounded-xl text-xs">
      <span class="px-3 py-1.5 rounded-lg bg-pink-600 text-white font-medium">唇部比例模式</span>
    </div>
  </header>

  <!-- 主分析區塊 -->
  <main class="w-full max-w-4xl mt-4 grid grid-cols-1 md:grid-cols-3 gap-5">
    
    <!-- 鏡頭與 HUD -->
    <div class="md:col-span-2 flex flex-col items-center">
      <div class="relative w-full aspect-[3/4] sm:aspect-[4/3] rounded-2xl overflow-hidden bg-slate-900 border border-slate-800 shadow-2xl flex items-center justify-center">
        
        <video id="webcam" class="absolute inset-0 w-full h-full object-cover transform -scale-x-100" playsinline></video>
        <canvas id="output-canvas" class="absolute inset-0 w-full h-full object-cover transform -scale-x-100"></canvas>
        <div id="scan-line" class="scanner-line pointer-events-none hidden"></div>

        <!-- 唇部指引框 -->
        <div id="guide-frame" class="guide-box absolute w-48 h-36 rounded-3xl pointer-events-none"></div>

        <!-- 狀態提示 -->
        <div id="status-pill" class="absolute top-4 bg-slate-900/90 backdrop-blur-md border border-slate-700 text-slate-200 text-xs px-4 py-2 rounded-full flex items-center space-x-2 shadow-lg">
          <span class="w-2 h-2 rounded-full bg-pink-400 animate-ping"></span>
          <span id="guide-msg">定位唇部幾何中...</span>
        </div>
      </div>

      <!-- 防呆驗證 -->
      <div class="w-full grid grid-cols-3 gap-2 mt-3 text-[11px]">
        <div id="badge-yaw" class="flex items-center justify-center space-x-1.5 p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-400">
          <i data-lucide="compass" class="w-3.5 h-3.5"></i>
          <span>正對鏡頭</span>
        </div>
        <div id="badge-dist" class="flex items-center justify-center space-x-1.5 p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-400">
          <i data-lucide="smile" class="w-3.5 h-3.5"></i>
          <span>放鬆閉唇</span>
        </div>
        <div id="badge-stable" class="flex items-center justify-center space-x-1.5 p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-400">
          <i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
          <span>靜止防抖</span>
        </div>
      </div>
    </div>

    <!-- 數據儀表板 -->
    <div class="flex flex-col space-y-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between h-full">
        <div>
          <div class="flex items-center justify-between">
            <h2 class="text-xs font-semibold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
              <i data-lucide="sparkles" class="w-4 h-4 text-pink-400"></i>
              唇型美學黃金指標
            </h2>
            <span class="text-[10px] px-2 py-0.5 rounded bg-pink-950 text-pink-400 border border-pink-800/50">即時演算</span>
          </div>

          <!-- 圓形儀表板：黃金比例吻合度 -->
          <div class="mt-6 flex flex-col items-center">
            <div class="relative w-36 h-36 flex items-center justify-center">
              <svg class="w-full h-full transform -rotate-90">
                <circle cx="72" cy="72" r="56" stroke="currentColor" stroke-width="8" class="text-slate-800 fill-none" />
                <circle id="meter-circle" cx="72" cy="72" r="56" stroke="currentColor" stroke-width="8" stroke-dasharray="351.8" stroke-dashoffset="351.8" stroke-linecap="round" class="text-pink-500 fill-none transition-all duration-300" />
              </svg>
              <div class="absolute flex flex-col items-center text-center">
                <span id="primary-metric-val" class="text-3xl font-bold tracking-tight">--</span>
                <span class="text-[10px] text-slate-400 tracking-wider">唇型協調指數</span>
              </div>
            </div>

            <!-- 細項指標 -->
            <div class="w-full space-y-2.5 mt-5 text-xs">
              <div class="flex justify-between items-center py-1.5 border-b border-slate-800/80">
                <span class="text-slate-400">上下唇厚度比</span>
                <span id="metric-ratio" class="font-mono text-pink-300 font-semibold">--</span>
              </div>
              <div class="flex justify-between items-center py-1.5 border-b border-slate-800/80">
                <span class="text-slate-400">上唇厚度佔比</span>
                <span id="metric-upper-pct" class="font-mono text-slate-200">--%</span>
              </div>
              <div class="flex justify-between items-center py-1.5 border-b border-slate-800/80">
                <span class="text-slate-400">唇寬 / 鼻寬比例</span>
                <span id="metric-width-ratio" class="font-mono text-slate-200">--</span>
              </div>
              <div class="flex justify-between items-center py-1.5 border-b border-slate-800/80">
                <span class="text-slate-400">雙側唇峰平衡性</span>
                <span id="metric-peak-sym" class="font-mono text-slate-200">--%</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 導出圖卡 -->
        <div class="mt-6 pt-3 border-t border-slate-800">
          <button id="export-card-btn" disabled class="w-full py-3 bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-400 hover:to-rose-500 disabled:opacity-30 disabled:cursor-not-allowed font-medium rounded-xl text-xs transition-all shadow-lg shadow-pink-500/10 flex items-center justify-center space-x-2">
            <i data-lucide="download" class="w-4 h-4"></i>
            <span>下載唇型美學幾何圖卡 (PNG)</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <footer class="w-full max-w-4xl mt-5 p-4 rounded-xl bg-slate-900/60 border border-slate-800 text-[11px] text-slate-500 leading-relaxed">
    <p class="font-semibold text-slate-400">【美學設計與生活造型參考宣告】</p>
    <p>本系統僅根據鏡頭幾何座標計算唇部外觀比例，數據供唇彩勾勒、妝容明暗對比、彩妝打亮及日常美學造型參考，非醫療器材，不具備任何侵入性微整評估或病理診斷功能。</p>
  </footer>

  <script>
    lucide.createIcons();

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output-canvas');
    const ctx = canvas.getContext('2d');
    const guideMsg = document.getElementById('guide-msg');
    const guideFrame = document.getElementById('guide-frame');
    const scanLine = document.getElementById('scan-line');
    const exportBtn = document.getElementById('export-card-btn');

    const badgeYaw = document.getElementById('badge-yaw');
    const badgeDist = document.getElementById('badge-dist');
    const badgeStable = document.getElementById('badge-stable');

    const primaryVal = document.getElementById('primary-metric-val');
    const meterCircle = document.getElementById('meter-circle');
    const metricRatio = document.getElementById('metric-ratio');
    const metricUpperPct = document.getElementById('metric-upper-pct');
    const metricWidthRatio = document.getElementById('metric-width-ratio');
    const metricPeakSym = document.getElementById('metric-peak-sym');

    let stableCount = 0;
    const CIRCUMFERENCE = 2 * Math.PI * 56;

    let reportData = {
      score: 0,
      ratioStr: '--',
      upperPctStr: '--',
      widthRatioStr: '--',
      peakSymStr: '--',
      tip: ''
    };

    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });
    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.65
    });
    faceMesh.onResults(onResults);

    function onResults(results) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
        handleReset("請將唇部對準中央導引框");
        return;
      }

      const lm = results.multiFaceLandmarks[0];

      // 關鍵特徵點
      const noseTip = lm[1];
      const noseLeft = lm[98];
      const noseRight = lm[327];
      const leftIris = lm[468];
      const rightIris = lm[473];

      // 唇部關鍵點
      const upperLipTop = lm[0];    // 上唇頂中點
      const lipContact = lm[13];    // 上下唇閉合接觸點
      const lowerLipBottom = lm[17]; // 下唇底中點
      const mouthLeft = lm[61];     // 左嘴角
      const mouthRight = lm[291];   // 右嘴角
      const peakLeft = lm[37];      // 左唇峰
      const peakRight = lm[267];    // 右唇峰

      // 1. 防呆條件：正臉角度檢查 (Yaw)
      const midEyeX = (leftIris.x + rightIris.x) / 2;
      const yawDelta = Math.abs(noseTip.x - midEyeX);
      const isYawOk = yawDelta < 0.025;
      updateBadge(badgeYaw, isYawOk, "擺正良好", "視角偏斜");

      // 2. 防呆條件：閉唇狀態檢查 (若張嘴則垂直接觸點與內側點差距變大)
      const mouthAperture = Math.hypot(lm[13].x - lm[14].x, lm[13].y - lm[14].y);
      const isMouthClosed = mouthAperture < 0.018;
      updateBadge(badgeDist, isMouthClosed, "唇態自然", "請自然放鬆閉唇");

      // 3. 幾何厚度計算
      const upperH = Math.hypot(upperLipTop.x - lipContact.x, upperLipTop.y - lipContact.y);
      const lowerH = Math.hypot(lowerLipBottom.x - lipContact.x, lowerLipBottom.y - lipContact.y);
      const totalH = upperH + lowerH;

      if (totalH === 0) return;

      const upperRatio = upperH / lowerH; // 理想 1 : 1.3 ~ 1.5 (約 0.67 ~ 0.77)
      const upperPct = Math.round((upperH / totalH) * 100);
      const lowerPct = 100 - upperPct;

      // 唇寬 vs 鼻翼寬
      const mouthW = Math.hypot(mouthLeft.x - mouthRight.x, mouthLeft.y - mouthRight.y);
      const noseW = Math.hypot(noseLeft.x - noseRight.x, noseLeft.y - noseRight.y);
      const widthRatio = (mouthW / (noseW || 1)).toFixed(2); // 理想 1.35 ~ 1.55

      // 唇峰對稱度 (比對左右唇峰高度到唇中線的垂直位移)
      const leftPeakH = Math.abs(peakLeft.y - lipContact.y);
      const rightPeakH = Math.abs(peakRight.y - lipContact.y);
      const peakSym = Math.round((Math.min(leftPeakH, rightPeakH) / Math.max(leftPeakH, rightPeakH)) * 100) || 0;

      // 評分算法：以黃金比例 1:1.35 (上唇約 42%) 為 100 分基準
      const idealRatio = 0.74; // 1 / 1.35
      const ratioDiff = Math.abs(upperRatio - idealRatio);
      const score = Math.max(50, Math.min(100, Math.round(100 - ratioDiff * 90)));

      // 更新儀表板
      primaryVal.innerText = score;
      meterCircle.style.strokeDashoffset = CIRCUMFERENCE - (score / 100) * CIRCUMFERENCE;
      metricRatio.innerText = `1 : ${(1 / upperRatio).toFixed(2)}`;
      metricUpperPct.innerText = `${upperPct}% : ${lowerPct}%`;
      metricWidthRatio.innerText = `${widthRatio} : 1`;
      metricPeakSym.innerText = `${peakSym}%`;

      // 防抖驗證
      const ready = isYawOk && isMouthClosed;
      if (ready) {
        stableCount++;
        updateBadge(badgeStable, stableCount > 15, "數據鎖定", "保持靜止");
      } else {
        stableCount = Math.max(0, stableCount - 2);
        updateBadge(badgeStable, false, "等待穩定", "校準中");
      }

      const allLocked = ready && (stableCount > 15);
      if (allLocked) {
        guideMsg.innerText = "唇型測量完成，可導出分析卡";
        guideFrame.classList.add('ready');
        scanLine.classList.remove('hidden');
        exportBtn.disabled = false;
      } else {
        guideMsg.innerText = "請放鬆唇部並保持正對";
        guideFrame.classList.remove('ready');
        scanLine.classList.add('hidden');
        exportBtn.disabled = true;
      }

      // 繪製專業唇部 HUD
      drawLipOverlay(ctx, lm, canvas.width, canvas.height);

      // 動態美學建議文字
      let styleAdvice = "";
      if (upperRatio < 0.6) {
        styleAdvice = "上唇較顯輕薄，建議在唇峰上方使用高光打亮，並利用唇筆稍微往外勾勒上唇緣，增加立體飽滿感。";
      } else if (upperRatio > 0.85) {
        styleAdvice = "上下唇厚度比例接近，適合咬唇妝或漸層妝容，外緣輕微遮瑕可營造精巧內斂的視覺焦點。";
      } else {
        styleAdvice = "上下唇厚度非常接近黃金美學比例，適合飽和度高的唇膏質地，直接沿天然唇線塗抹即可展現完美比例。";
      }

      reportData = {
        score: score,
        ratioStr: `1 : ${(1 / upperRatio).toFixed(2)}`,
        upperPctStr: `上唇 ${upperPct}% / 下唇 ${lowerPct}%`,
        widthRatioStr: `${widthRatio} : 1 (唇寬/鼻寬)`,
        peakSymStr: `${peakSym}%`,
        tip: styleAdvice
      };
    }

    function drawLipOverlay(ctx, lm, w, h) {
      // 唇部輪廓關鍵點串聯 (外輪廓)
      const outerLipIndices = [61, 185, 40, 39, 37, 0, 267, 269, 270, 409, 291, 375, 321, 405, 314, 17, 84, 181, 91, 146, 61];
      
      ctx.strokeStyle = "rgba(236, 72, 153, 0.7)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      outerLipIndices.forEach((idx, i) => {
        const pt = lm[idx];
        if (i === 0) ctx.moveTo(pt.x * w, pt.y * h);
        else ctx.lineTo(pt.x * w, pt.y * h);
      });
      ctx.stroke();

      // 垂直厚度量測軸線 (上唇頂 -> 唇縫 -> 下唇底)
      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(lm[0].x * w, lm[0].y * h);
      ctx.lineTo(lm[13].x * w, lm[13].y * h);
      ctx.lineTo(lm[17].x * w, lm[17].y * h);
      ctx.stroke();

      // 唇寬水平軸線 (左嘴角 -> 右嘴角)
      ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(lm[61].x * w, lm[61].y * h);
      ctx.lineTo(lm[291].x * w, lm[291].y * h);
      ctx.stroke();
      ctx.setLineDash([]);

      // 標註關鍵測量錨點
      ctx.fillStyle = "#ec4899";
      [0, 13, 17, 61, 291, 37, 267].forEach(idx => {
        ctx.beginPath();
        ctx.arc(lm[idx].x * w, lm[idx].y * h, 3, 0, 2 * Math.PI);
        ctx.fill();
      });
    }

    function handleReset(msg) {
      guideMsg.innerText = msg;
      updateBadge(badgeYaw, false, "", "等待唇部");
      updateBadge(badgeDist, false, "", "等待唇部");
      updateBadge(badgeStable, false, "", "等待目標");
      primaryVal.innerText = "--";
      meterCircle.style.strokeDashoffset = CIRCUMFERENCE;
      exportBtn.disabled = true;
      scanLine.classList.add('hidden');
    }

    function updateBadge(el, isOk, okText, badText) {
      if (isOk) {
        el.className = "flex items-center justify-center space-x-1.5 p-2 rounded-xl bg-emerald-950/40 border border-emerald-800 text-emerald-400 font-medium";
        el.querySelector('span').innerText = okText;
      } else {
        el.className = "flex items-center justify-center space-x-1.5 p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-400";
        el.querySelector('span').innerText = badText;
      }
    }

    const camera = new Camera(video, {
      onFrame: async () => {
        await faceMesh.send({ image: video });
      },
      width: 640,
      height: 480
    });
    camera.start();

    // 導出專業圖卡 (PNG)
    exportBtn.onclick = () => {
      const card = document.createElement('canvas');
      card.width = 800;
      card.height = 1000;
      const c = card.getContext('2d');

      // 背景漸層
      const grad = c.createLinearGradient(0, 0, 0, 1000);
      grad.addColorStop(0, '#0f172a');
      grad.addColorStop(1, '#020617');
      c.fillStyle = grad;
      c.fillRect(0, 0, 800, 1000);

      // 邊框
      c.strokeStyle = '#334155';
      c.lineWidth = 2;
      c.strokeRect(30, 30, 740, 940);

      // 標題
      c.fillStyle = '#ec4899';
      c.font = 'bold 30px sans-serif';
      c.fillText("AuraMetric 唇部美學幾何分析卡", 60, 95);

      c.fillStyle = '#94a3b8';
      c.font = '15px sans-serif';
      c.fillText(`分析模式：唇型黃金幾何比例  |  日期：${new Date().toLocaleDateString()}`, 60, 135);

      // 分數大區塊
      c.fillStyle = '#1e293b';
      c.fillRect(60, 170, 680, 180);

      c.fillStyle = '#f43f5e';
      c.font = 'bold 72px sans-serif';
      c.textAlign = 'center';
      c.fillText(`${reportData.score}`, 400, 265);

      c.fillStyle = '#cbd5e1';
      c.font = '16px sans-serif';
      c.fillText("唇型黃金協調指數", 400, 310);
      c.textAlign = 'left';

      // 細節量測指標清單
      c.font = '20px sans-serif';
      c.fillStyle = '#f8fafc';
      c.fillText(`• 上下唇厚度比例： ${reportData.ratioStr} (標準建議 1 : 1.3~1.5)`, 80, 410);
      c.fillText(`• 厚度分佈： ${reportData.upperPctStr}`, 80, 460);
      c.fillText(`• 唇鼻寬度協調比： ${reportData.widthRatioStr}`, 80, 510);
      c.fillText(`• 左右唇峰對稱度： ${reportData.peakSymStr}`, 80, 560);

      // 彩妝造型建議
      c.fillStyle = '#1e293b';
      c.fillRect(60, 610, 680, 150);
      c.fillStyle = '#f472b6';
      c.font = 'bold 18px sans-serif';
      c.fillText("【唇彩造型與視覺焦點調整建議】", 80, 650);

      c.fillStyle = '#cbd5e1';
      c.font = '15px sans-serif';
      wrapText(c, reportData.tip, 80, 690, 640, 24);

      // 法律免責聲明
      c.strokeStyle = '#334155';
      c.beginPath();
      c.moveTo(60, 790);
      c.lineTo(740, 790);
      c.stroke();

      c.fillStyle = '#64748b';
      c.font = '12px sans-serif';
      c.fillText("【日常美學參考與法律免責聲明】", 60, 830);
      c.fillText("1. 本數值為純前端攝影機特徵座標之幾何計算結果，非醫療臨床檢測，不可作為侵入處置依據。", 60, 855);
      c.fillText("2. 唇部特徵測量僅供日常妝容描繪、唇膏光澤選擇等造型美學搭配使用。", 60, 880);
      c.fillText("3. 系統端採即時記憶體運算，不傳輸且不儲存任何臉部特徵個資，嚴格保障個人隱私。", 60, 905);

      const link = document.createElement('a');
      link.download = `Lip-Metric-Report-${Date.now()}.png`;
      link.href = card.toDataURL('image/png');
      link.click();
    };

    // Canvas 自動換行輔助函數
    function wrapText(context, text, x, y, maxWidth, lineHeight) {
      let words = text.split('');
      let line = '';
      for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n];
        let metrics = context.measureText(testLine);
        let testWidth = metrics.width;
        if (testWidth > maxWidth && n > 0) {
          context.fillText(line, x, y);
          line = words[n];
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      context.fillText(line, x, y);
    }
  </script>
